<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SebaChavez Car Service · Sistema VB (demo)</title>
<meta name="theme-color" content="#2b2f36">
<style>
:root{--rojo:#e53935;--azul:#1e6fd0;--grafito:#3a3d43;--noche:#23262b;--bg:#f2f4f7;--card:#fff;--bd:#dfe3e8;--tx:#1d2127;--mut:#667085;--ok:#1f9d55;--warn:#d98b0a;--bad:#d32f2f;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0 0 .4em;line-height:1.2}
h2{font-size:1.25rem}h3{font-size:1.02rem}
.hide,[hidden]{display:none!important}
.mut{color:var(--mut)}.sm{font-size:.86rem}.r{text-align:right}.c{text-align:center}.b{font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.g2>*,.g3>*,.g4>*,.card{min-width:0}
.btn{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:8px 14px;min-height:40px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--tx)}
.btn:hover{border-color:#b9c0ca;background:#f7f8fa}
.btn.p{background:var(--azul);border-color:var(--azul);color:#fff}.btn.p:hover{background:#1859ab}
.btn.d{background:var(--rojo);border-color:var(--rojo);color:#fff}.btn.d:hover{background:#c62828}
.btn.s{min-height:32px;padding:4px 10px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input,select,textarea{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;background:#fff;width:100%;min-height:40px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:2px solid var(--azul);outline-offset:1px}
label{display:block;font-size:.82rem;font-weight:600;color:var(--mut);margin:0 0 3px}
.f{margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:14px}
.card h3{margin-bottom:8px}
/* login */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#fff 0%,#eef2f8 60%,#e7edf7 100%)}
.lbox{width:100%;max-width:560px;background:#fff;border:1px solid var(--bd);border-radius:16px;padding:22px;box-shadow:0 10px 40px rgba(20,30,50,.08)}
.lbox .logo{display:block;margin:0 auto 6px;width:150px;height:auto}
.ucard{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--bd);background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;min-height:52px}
.ucard:hover{border-color:var(--azul);background:#f5f9ff}
.av{width:36px;height:36px;border-radius:50%;background:var(--grafito);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.demoflag{background:#fff6e0;border:1px solid #f1d38a;color:#7a5400;border-radius:8px;padding:8px 10px;font-size:.84rem;margin:10px 0}
/* VB banner */
.vb{background:linear-gradient(120deg,#1b1d21,#2c2f35);color:#fff;border-radius:12px;padding:14px;margin-top:14px}
.vb b{color:#ff8a1f}
.vb .lema{font-style:italic;color:#d6d9de;font-size:.9rem}
.vbb{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.vbb a{flex:1;min-width:110px;min-height:48px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;font-weight:700;text-decoration:none;color:#fff;background:#ff7a00;padding:0 14px}
.vbb a.w{background:#25a244}.vbb a.t{background:#3c6fd6}.vbb a.m{background:#ff7a00}
.vbl{font-size:.78rem;color:#9aa1ab;text-align:center;padding:6px}
/* app */
#app{display:flex;min-height:100vh}
#side{width:236px;background:var(--noche);color:#e6e8ec;flex:none;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
#side .brand{padding:14px 12px 8px;text-align:center;background:#fff}
#side .brand img{width:96px;height:auto;display:block;margin:0 auto}
#side nav{padding:8px;flex:1}
#side nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#cfd3da;padding:10px 12px;border-radius:8px;cursor:pointer;min-height:42px}
#side nav button:hover{background:#2f333a}
#side nav button.on{background:var(--azul);color:#fff;font-weight:700}
#side .badge2{margin-left:auto;background:var(--rojo);color:#fff;border-radius:999px;font-size:.72rem;padding:1px 7px}
#side .who{padding:10px 12px;border-top:1px solid #343840;font-size:.84rem}
#side .vbs{padding:8px 12px 12px;font-size:.72rem;color:#8f96a1}
#side .vbs a{color:#ff9a3d}
#main{flex:1;min-width:0}
#top{display:none;background:var(--noche);color:#fff;padding:8px 12px;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
#top button{background:none;border:1px solid #555;color:#fff;border-radius:8px;min-width:44px;min-height:40px;font-size:1.1rem}
#view{padding:18px;max-width:1500px}
@media(max-width:900px){#side{position:fixed;left:-250px;top:0;z-index:30;transition:left .2s}#side.open{left:0}#top{display:flex}#view{padding:12px}}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar h2{margin:0 12px 0 0}
/* tables */
.tw{overflow:auto;border:1px solid var(--bd);border-radius:var(--r);background:#fff}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid #edf0f3;text-align:left;vertical-align:top;font-size:.92rem}
th{background:#f6f8fa;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:#5a6472;position:sticky;top:0;white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
tr.clk{cursor:pointer}tr.clk:hover td{background:#f5f9ff}
tr.sel td{background:#d9ecff}
tr.low td{background:#fff3c4}
tr.off td{opacity:.5}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.76rem;font-weight:700;background:#e9edf2;color:#44505e;white-space:nowrap}
.b-Recibido{background:#e7eefb;color:#1d4ea0}.b-Diagnóstico{background:#efe6fb;color:#5b2ea6}.b-Presupuesto{background:#fff0d6;color:#8a5a00}
.b-En\ reparación{background:#ffe3e0;color:#b3261e}.b-Listo{background:#dff5e7;color:#1b7a43}.b-Entregado{background:#e9edf2;color:#56606d}
.ok{background:#dff5e7;color:#1b7a43}.warn{background:#fff0d6;color:#8a5a00}.bad{background:#ffe3e0;color:#b3261e}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:12px;cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--azul)}
.kpi .v{font-size:1.55rem;font-weight:800;line-height:1.1}.kpi .l{font-size:.8rem;color:var(--mut);font-weight:600}
.kpi.bad .v{color:var(--bad)}.kpi.okk .v{color:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.86rem;font-weight:600;min-height:34px}
.chip.on{background:var(--grafito);color:#fff;border-color:var(--grafito)}
/* kanban */
.kan{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:10px;overflow:auto;padding-bottom:8px}
.kcol{background:#e9edf2;border-radius:10px;padding:8px;min-height:140px}
.kcol h4{margin:2px 4px 8px;font-size:.84rem;text-transform:uppercase;letter-spacing:.04em;color:#4a5461;display:flex;justify-content:space-between}
.kc{background:#fff;border:1px solid var(--bd);border-left:4px solid var(--azul);border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:pointer}
.kc:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.kc .pat{font-weight:800;letter-spacing:.06em}
.kc.deuda{border-left-color:var(--rojo)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(15,20,30,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto}
.mbox{background:#fff;border-radius:14px;width:100%;max-width:620px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mbox.wide{max-width:980px}
.mh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:#fff;border-radius:14px 14px 0 0;z-index:2}
.mh h3{margin:0;flex:1}
.mb{padding:16px}
.mf{padding:12px 16px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:#fafbfc;border-radius:0 0 14px 14px}
.err{background:#ffe3e0;color:#9b1c14;border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:.9rem}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#23262b;color:#fff;padding:10px 16px;border-radius:10px;z-index:90;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#toast.bad{background:#b3261e}
/* turnos grid */
.tg{display:grid;grid-template-columns:60px repeat(4,minmax(150px,1fr));min-width:760px;border:1px solid var(--bd);background:#fff;border-radius:10px;overflow:hidden}
.tg .hd{background:#f6f8fa;font-weight:700;font-size:.8rem;padding:8px;border-bottom:1px solid var(--bd);border-left:1px solid #edf0f3}
.tg .hr{padding:6px;font-size:.8rem;color:var(--mut);border-bottom:1px solid #edf0f3;height:56px}
.tg .cell{border-bottom:1px solid #edf0f3;border-left:1px solid #edf0f3;height:56px;cursor:pointer;position:relative}
.tg .cell:hover{background:#f0f6ff}
.tb{position:absolute;left:2px;right:2px;top:2px;border-radius:6px;padding:4px 6px;font-size:.78rem;overflow:hidden;color:#fff;background:var(--azul);z-index:1;cursor:pointer}
.tb.Confirmado{background:#1f9d55}.tb.Pendiente{background:#d98b0a}.tb.Taller{background:#6a3fc0}.tb.Cancelado{background:#8a8f98;text-decoration:line-through}
.pbar{height:10px;background:#e3e7ec;border-radius:99px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--ok)}
.hbar{height:16px;background:var(--azul);border-radius:4px;min-width:2px}
.itbl input,.itbl select{min-height:34px;padding:4px 6px}
.det{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:10px}
.pill{display:inline-block;background:#eef1f5;border-radius:6px;padding:1px 7px;font-size:.8rem}
#printArea{display:none}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.dg>div{background:#f6f8fa;border-radius:8px;padding:6px 8px;min-width:0}.dg label{margin:0;font-size:.7rem}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:96px;height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--bd);cursor:zoom-in;background:#eef1f5}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .btn{position:absolute;top:2px;right:2px;min-height:26px;padding:0 7px;background:rgba(255,255,255,.92)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
#lb img{max-width:100%;max-height:100%;border-radius:8px}
.filebtn{position:relative;margin:0;cursor:pointer}
.inl{width:96px;min-height:34px;padding:4px 6px;text-align:right}
.cr input,.er input{min-height:36px}
.steps{font-size:.8rem;color:var(--mut);margin-top:6px}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important;padding:0;color:#000;background:#fff}#printArea table th{position:static}}
.pa h1{font-size:1.3rem}.pa .hdr{display:flex;gap:14px;align-items:center;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px}.pa .hdr img{width:80px}
.pa td,.pa th{border:1px solid #999;font-size:.85rem}
</style>
</head>

<div id="app" hidden>

  <div id="main">

</div>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

/* ---- repuestos: opciones del selector ---- */
function repOptions(q,sel){const nq=norm(q),nc=ncode(q);
 let l=DB.repuestos.filter(r=>r.activo&&(!nq||repHay(r).includes(nq)||(nc&&repCodes(r).some(c=>ncode(c).includes(nc)))));
 if(nq&&nc){const ex=l.filter(r=>repCodes(r).some(c=>ncode(c)===nc));l=ex.concat(l.filter(r=>ex.indexOf(r)<0))}
 const s=sel&&repOf(sel);if(s&&s.qty>0)l=[s].concat(l.filter(r=>r!==s));
 l=l.slice(0,60);
 return l.length?l.map(r=>'<option value="'+r.id+'"'+(r.qty<=0?' disabled':'')+(s&&r.id===s.id?' selected':'')+'>'+h(r.desc+' · '+r.marca+' · stock '+r.qty+' · '+fmt(r.pv))+'</option>').join(''):'<option value="">Sin coincidencias</option>'}
CHG.otrq=t=>{const s=$('#o_rep');if(s){s.innerHTML=repOptions(t.value);CHG.otrepsel()}};
CHG.otrepsel=()=>{const box=$('#o_eq');if(!box)return;const r=repOf(val('o_rep'));if(!r){box.innerHTML='';return}const eq=equivOf(r);
 box.innerHTML=eq.length?'<b>Equivalentes:</b><br>'+eq.map(e=>'<span class="pill">'+h(e.r.desc+' · '+e.r.marca)+' · stock '+e.r.qty+' · '+fmt(e.r.pv)+'</span> <span class="mut">'+h(e.txt)+'</span> <button class="btn s" data-act="otuseeq" data-id="'+e.r.id+'"'+(e.r.qty>0?'':' disabled')+'>Usar</button>').join('<br>'):'<span class="mut">Sin equivalentes cargados para este artículo.</span>'};
ACT.otuseeq=d=>{const q=$('#o_rq');if(q)q.value='';const s=$('#o_rep');if(s){s.innerHTML=repOptions('',d.id);CHG.otrepsel()}};
CHG.otmosel=t=>{const s=DB.servicios.find(x=>x.id===t.value);const dd=$('#o_mdesc');if(dd)dd.hidden=t.value!=='__libre';const p=$('#o_mpu');if(p)p.value=s?s.pu:''};

 let v=t.value;if(f==='km')v=parseInt(v)||0;
 if(mech&&(f==='obs'||f==='pedido')&&!o.mecId)o.mecId=ME.id;
 o[f]=v;if(f==='km'&&v){const x=vehOf(o.vehId);if(x)x.km=Math.max(x.km,v)}save()};

 if(f==='pu'){if(!(v>=0)||v>9999999||t.value.trim()===''){t.style.borderColor='var(--bad)';return}i.pu=r2(v)}else{if(!(v>0)||v>999){t.style.borderColor='var(--bad)';return}i.qty=v}
 t.style.borderColor='';
 const c=$('#li_t'+t.dataset.i);if(c)c.textContent=fmt(r2(i.qty*i.pu));const b=$('#li_b'+t.dataset.i);if(b)b.innerHTML=(i.pu0!==undefined&&Math.abs(i.pu-i.pu0)>0.004)?' <span class="badge">valor editado</span>':'';

CHGC.otlineaud=t=>{const o=otOf(t.dataset.id),i=o&&o.items[+t.dataset.i];if(!i)return;audit('OT '+otNum(o)+' · '+(t.dataset.f==='pu'?'valor de mano de obra editado':'cantidad de mano de obra editada'),i.desc+' → '+(t.dataset.f==='pu'?fmt(i.pu)+' (lista '+fmt(i.pu0)+')':i.qty));save()};

/* ---- estados y presupuesto ---- */
ACT.otestado=d=>{const o=otOf(d.id),to=d.to;if(!o||o.estado===to||o.estado==='Entregado')return;const mech=ME.rol==='mecanico';
 if(mech){
  if(!otVisible(o)){toast('Esta orden está asignada a otro mecánico.',1);return}
  const ok=(o.estado==='Recibido'&&to==='Diagnóstico')||(o.estado==='Diagnóstico'&&to==='Presupuesto')||(o.estado==='En reparación'&&to==='Listo');
  if(!ok){toast('Ese cambio de estado lo hace el jefe de taller o el dueño.',1);return}
  if(to==='Diagnóstico'&&!o.mecId)o.mecId=ME.id;
  if(to==='Presupuesto'&&(o.obs||'').trim().length<10){toast('Cargá el diagnóstico (mínimo 10 caracteres) antes de enviarlo al jefe / dueño.',1);return}
 }else{
  if(!canBudget()){toast('Tu perfil no puede cambiar el estado de la orden.',1);return}

  if(to==='Listo'&&!o.presAprob){toast('Falta la aprobación del presupuesto por parte del cliente.',1);return}
 }
 audit('OT '+otNum(o),o.estado+' → '+to);o.estado=to;otRefresh(o);renderView()};
ACT.otpres=d=>{const o=otOf(d.id);if(!o||!canBudget()||o.estado==='Entregado')return;
 if(d.a==='env'){if(!o.items.length){toast('Cargá repuestos o mano de obra antes de entregar el presupuesto.',1);return}o.presEnv={f:TODAY(),u:ME.n};if(o.estado==='Recibido'||o.estado==='Diagnóstico')o.estado='Presupuesto';audit('Presupuesto entregado',otNum(o))}
 else if(d.a==='apr'){if(!o.presEnv){toast('Primero marcá el presupuesto como entregado al cliente.',1);return}o.presAprob=true;o.presApF=TODAY();audit('Presupuesto aprobado (sin cobro)',otNum(o));
  if(o.estado!=='En reparación'&&o.estado!=='Listo'){if(o.mecId)o.estado='En reparación';else toast('Aprobado. Asigná un mecánico para pasar a reparación.')}}
 else{o.presAprob=false;o.presApF='';audit('Aprobación quitada',otNum(o))}

/* ---- ítems ---- */
ACT.otaddrep=d=>{const o=otOf(d.id);if(!o||!canBudget()||o.estado==='Entregado')return;const r=repOf(val('o_rep'));const q=parseInt(val('o_rqty'));if(!r){toast('Elegí un repuesto.',1);return}if(!(q>0)){toast('Cantidad inválida.',1);return}
 if(q>r.qty){const eq=equivOf(r).filter(e=>e.r.qty>0);toast('Stock insuficiente: hay '+r.qty+' de '+r.desc+'.'+(eq.length?' Equivalentes con stock: '+eq.map(e=>e.r.desc+' '+e.r.marca+' ('+e.r.qty+')').join(', '):''),1);return}
 stockMove(r,-q,'Uso en OT',otNum(o)+' · '+((vehOf(o.vehId)||{}).pat||''));
 const ex=o.items.find(i=>i.k==='rep'&&i.repId===r.id&&!!i.extra===!!o.presAprob);if(ex)ex.qty+=q;else o.items.push({k:'rep',repId:r.id,desc:r.desc+' ('+r.marca+')',qty:q,pu:r.pv,pu0:r.pv,iva:r.iva,costo:r.pc,extra:!!o.presAprob});
 audit('OT '+otNum(o),'+ '+q+' × '+r.desc+(o.presAprob?' (adicional)':''));otRefresh(o)};
ACT.otaddmo=d=>{const o=otOf(d.id);if(!o||!canBudget()||o.estado==='Entregado')return;const sid=val('o_mo'),s=DB.servicios.find(x=>x.id===sid),libre=sid==='__libre';const q=num(val('o_mqty'));
 if(!s&&!libre){toast('Elegí un servicio o “Trabajo libre”.',1);return}if(!(q>0)){toast('Cantidad inválida.',1);return}
 const desc=libre?val('o_mdesc').trim():s.n;if(libre&&desc.length<4){toast('Describí el trabajo libre.',1);return}
 const raw=val('o_mpu').trim(),pu=raw===''?(s?s.pu:NaN):num(raw);if(!(pu>=0)||pu>9999999){toast('Ingresá el valor de la mano de obra.',1);return}
 o.items.push({k:'mo',desc,qty:q,pu:r2(pu),pu0:s?s.pu:r2(pu),iva:21,costo:0,extra:!!o.presAprob});audit('OT '+otNum(o),'+ MO '+desc+' '+fmt(r2(pu))+(o.presAprob?' (adicional)':''));otRefresh(o)};
ACT.otdel=d=>{const o=otOf(d.id),i=o&&o.items[+d.i];if(!i||!canBudget()||o.estado==='Entregado')return;if(i.k==='rep'){const r=repOf(i.repId);if(r)stockMove(r,i.qty,'Devolución a stock (quitado de OT)',otNum(o))}o.items.splice(+d.i,1);audit('OT '+otNum(o),'− '+i.desc);otRefresh(o)};

/* ---- fotos del diagnóstico ---- */
function imgCompress(file,max,q){return new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=rd.result};rd.onerror=rej;rd.readAsDataURL(file)})}
CHG.otfoto=t=>{const o=otOf(t.dataset.id);const files=[...(t.files||[])];t.value='';if(!o||o.estado==='Entregado'||!files.length)return;
 if(!(isBoss()||(ME.rol==='mecanico'&&otVisible(o)))){toast('No podés cargar fotos en esta orden.',1);return}
 if(o.fotos.length+files.length>6){toast('Máximo 6 fotos por orden en la demo.',1);return}
 files.forEach(f=>{if(!/^image\//.test(f.type)){toast('“'+f.name+'” no es una imagen.',1);return}
  imgCompress(f,1280,.68).then(data=>{if(o.fotos.length>=6)return;o.fotos.push({id:uid('f'),n:f.name.slice(0,40),data,t:Date.now(),u:ME.n});audit('Foto de diagnóstico',otNum(o)+' · '+f.name.slice(0,30));otRefresh(o)}).catch(()=>toast('No se pudo leer la imagen.',1))})};
ACT.fotover=d=>{const o=otOf(d.id),f=o&&o.fotos.find(x=>x.id===d.f);if(!f)return;const old=$('#lb');if(old)old.remove();const lb=document.createElement('div');lb.id='lb';lb.setAttribute('role','dialog');lb.setAttribute('aria-label','Foto ampliada');lb.innerHTML='<img src="'+f.data+'" alt="Foto ampliada del diagnóstico">';lb.addEventListener('click',()=>lb.remove());document.body.appendChild(lb)};
ACT.fotodel=d=>{const o=otOf(d.id);if(!o||o.estado==='Entregado')return;const f=o.fotos.find(x=>x.id===d.f);if(!f||!(isBoss()||f.u===ME.n))return;o.fotos.splice(o.fotos.indexOf(f),1);audit('Foto quitada',otNum(o));otRefresh(o)};

/* ---- cobrar y entregar (al final, con la posibilidad de haber sumado adicionales) ---- */
function pgCalc(o){const t=otTotal(o),c=cliOf(o.cliId);const ef=r2(num(val('pg_ef'))),tr=r2(num(val('pg_tr'))),tj=r2(num(val('pg_tj')));let cc=r2(num(val('pg_cc')));
 if([ef,tr,tj,cc].some(x=>x<0))return{err:'No se admiten importes negativos.'};
 if(r2(tr+tj)>t.saldo+0.004)return{err:'Transferencia + tarjeta superan el saldo ('+fmt(t.saldo)+').'};
 let efA,vuelto;
 if(chk('pg_ccrest')){efA=r2(Math.min(ef,Math.max(0,t.saldo-tr-tj)));vuelto=r2(ef-efA);cc=r2(t.saldo-tr-tj-efA)}
 else{if(r2(tr+tj+cc)>t.saldo+0.004)return{err:'Transferencia + tarjeta + cuenta corriente superan el saldo ('+fmt(t.saldo)+').'};efA=r2(Math.min(ef,Math.max(0,t.saldo-tr-tj-cc)));vuelto=r2(ef-efA)}
 if(cc>0.004&&(!c||!c.cc))return{err:'El cliente no tiene cuenta corriente habilitada.'};
 if(cc>0.004&&c.saldo+cc>c.lim+0.004)return{err:'Supera el límite de cuenta corriente del cliente ('+fmt(c.lim)+').'};
 return{ef:efA,tr,tj,cc:r2(cc),vuelto,total:r2(efA+tr+tj+cc),resta:r2(t.saldo-efA-tr-tj-cc)}}
CHG.pgcalc=()=>{const o=otOf(UI.cobroOt);if(!o||!$('#pg_res'))return;const r=pgCalc(o);$('#pg_res').innerHTML=r.err?'⚠ '+h(r.err):'Se cobra: <b>'+fmt(r.total)+'</b>'+(r.vuelto>0?' · <b>Vuelto a entregar: '+fmt(r.vuelto)+'</b>':'')+' · '+(r.resta>0.004?'<b>Falta cubrir '+fmt(r.resta)+'</b>':'Saldo cubierto: se puede entregar')};
function finEntrega(o){o.estado='Entregado';o.entregada=TODAY();o.entregadaPor=ME.n;const v=vehOf(o.vehId);if(v){v.km=Math.max(v.km||0,o.km||0);if(v.km){v.proxKm=Math.ceil((v.km+1000)/10000)*10000;v.proxFecha=addDays(180)}}
 o.items.forEach(i=>{if(i.k!=='rep')return;const r=repOf(i.repId);if(!r)return;let tipo='',cant=0,u='u';
  if(r.rubro==='ACEITE LUBRICANTE'){tipo='Aceite usado';cant=i.qty*(/x\s*(\d+)\s*L/i.test(r.desc)?+RegExp.$1:4);u='L'}
  else if(r.rubro==='FILTRO DE ACEITE'){tipo='Filtros usados';cant=i.qty}else if(r.rubro==='BATERÍAS'){tipo='Baterías';cant=i.qty}
  if(tipo)DB.resid.push({id:uid('z'),fecha:TODAY(),tipo,cant,unidad:u,ref:'Generado en '+otNum(o)})});
 const tu=DB.turnos.find(x=>x.otId===o.id);if(tu)tu.estado='Confirmado';
 audit('OT entregada y cobrada',otNum(o)+' · '+fmt(otTotal(o).total))}
ACT.otentregar=d=>{const o=otOf(d.id);if(!o)return;
 if(!canCharge()){toast('La entrega y el cobro los hacen el dueño o el jefe de taller.',1);return}
 if(o.estado!=='Listo'){toast('Para entregar, la reparación debe estar confirmada por el mecánico (estado “Listo”).',1);return}
 const c=cliOf(o.cliId),t=otTotal(o);UI.cobroOt=o.id;
 const done=()=>{save();closeModal();renderView();setTimeout(()=>ACT.otopen({id:o.id}),30)};
 if(t.saldo<=0.005){confirmBox('El total ya está cobrado. ¿Confirmás la entrega del vehículo? La OT queda cerrada y no se puede editar.',()=>{finEntrega(o);done();toast(otNum(o)+' entregada')},'Entregar');return}
 modal({title:'Cobrar y entregar · '+otNum(o),ok:'Cobrar y entregar',body:'<p>Total a cobrar al retirar el vehículo: <b style="font-size:1.2rem">'+fmt(t.saldo)+'</b> <span class="mut sm">(incluye los adicionales cargados)</span></p>'+
 '<div class="g2"><div class="f"><label for="pg_ef">Efectivo recibido</label><input id="pg_ef" inputmode="decimal" data-chg="pgcalc" placeholder="0,00"></div><div class="f"><label for="pg_caja">Ingresa a la caja</label><select id="pg_caja">'+(DB.turno.abierto?opts(DB.cajas,'C1',x=>[x.id,x.n]):'<option value="">⚠ No hay turno de caja abierto</option>')+'</select></div>'+
 '<div class="f"><label for="pg_tr">Transferencia</label><input id="pg_tr" inputmode="decimal" data-chg="pgcalc" placeholder="0,00"></div><div class="f"><label for="pg_tj">Tarjeta (débito/crédito)</label><input id="pg_tj" inputmode="decimal" data-chg="pgcalc" placeholder="0,00"></div>'+
 (c&&c.cc?'<div class="f"><label for="pg_cc">A cuenta corriente (límite '+fmt(c.lim)+' · deuda actual '+fmt(c.saldo)+')</label><input id="pg_cc" inputmode="decimal" data-chg="pgcalc" placeholder="0,00"></div><div class="f"><label style="font-weight:500;color:var(--tx)"><input type="checkbox" id="pg_ccrest" style="width:auto;min-height:0" data-chg="pgcalc"> Pasar a cuenta corriente lo que no se cobre ahora</label></div>':'')+
 '</div><div id="pg_res" class="demoflag" style="background:#eef6ff;border-color:#b9d6f7;color:#12406f"></div>',
 calc:()=>CHG.pgcalc(),
 onOk:()=>{try{const r=pgCalc(o);if(r.err)throw new Error(r.err);if(r.total<=0)throw new Error('Ingresá algún importe.');if(r.resta>0.004)throw new Error('Falta cubrir '+fmt(r.resta)+' para poder entregar el vehículo.');
  if(r.ef>0){if(!DB.turno.abierto)throw new Error('Abrí el turno de caja para cobrar en efectivo.');if(!val('pg_caja'))throw new Error('Elegí la caja.')}
  const f=TODAY();
  if(r.ef>0){o.pagos.push({id:uid('pg'),fecha:f,medio:'Efectivo',monto:r.ef,cajaId:val('pg_caja')});cajaMov(val('pg_caja'),'ingreso','f1',r.ef,otNum(o))}
  if(r.tr>0)o.pagos.push({id:uid('pg'),fecha:f,medio:'Transferencia',monto:r.tr,cajaId:''});
  if(r.tj>0)o.pagos.push({id:uid('pg'),fecha:f,medio:'Tarjeta',monto:r.tj,cajaId:''});
  if(r.cc>0.004){o.pagos.push({id:uid('pg'),fecha:f,medio:'Cuenta corriente',monto:r.cc,cajaId:''});c.saldo=r2(c.saldo+r.cc)}
  finEntrega(o);done();toast('Entregada y cobrada'+(r.vuelto>0?' · vuelto '+fmt(r.vuelto):''));return false}catch(e){merr(e.message);return false}}})};

<script>

 DB.seq.mov++;const m=Object.assign({id:'m'+DB.seq.mov,turnoId:DB.turno.id,cajaId,tipo,conc:concId,monto:r2(monto),ref:ref||'',u:ME?ME.n:'sistema',t:Date.now()},extra||{});DB.movs.push(m);return m}

 printHTML('<div class="hdr"><img src="'+LOGO+'" alt=""><div><h1 style="margin:0">'+h(DB.cfg.nombre)+'</h1>'+h(DB.cfg.dir)+' · Tel./WhatsApp '+h(DB.cfg.tel)+'<br>'+h(DB.cfg.mail)+' · Facebook: '+h(DB.cfg.fb)+' · Instagram: @'+h(DB.cfg.ig)+'</div></div>'+
 '<h2>'+(pres?'PRESUPUESTO':'ORDEN DE TRABAJO')+' · '+otNum(o)+'</h2><p>Fecha: '+fdate(o.fecha)+' · Cliente: <b>'+h(c.n)+'</b> '+(mech?'':h(c.tel))+'<br>Vehículo: <b>'+h(v.marca+' '+v.mod)+'</b> · Patente <b>'+h(v.pat)+'</b> · '+h(o.km)+' km · Mecánico: '+h((userOf(o.mecId)||{n:'—'}).n)+'</p><p>Motivo: '+h(o.motivo)+'</p>'+
 (pres?'':'<p>Diagnóstico: '+h(o.obs||'—')+'</p>')+
 (items.length?'<table><thead><tr>'+th+'</tr></thead><tbody>'+rows+'</tbody></table>':'<p class="sm">Sin trabajos ni repuestos autorizados todavía.</p>')+

 (pres?'<p class="sm">El presupuesto se aprueba sin cobro; el total se abona al retirar el vehículo e incluye los adicionales que se autoricen. Sujeto a revisión si el desarmado difiere del diagnóstico. Validez y condiciones: [VERIFICAR / completar por el taller].</p><p>Conformidad del cliente: ______________________</p>':
  '<p class="sm">Recepción: aceite '+(ck.aceite?'OK':'revisar')+' · luces '+(ck.luces?'OK':'revisar')+' · neumáticos '+(ck.neum?'OK':'revisar')+' · auxilio '+(ck.auxilio?'sí':'no')+' · docs '+(ck.docs?'sí':'no')+' · combustible '+h(ck.comb)+' · golpes previos: '+(ck.rayones?'SÍ (ver observaciones)':'no')+' · fotos del diagnóstico: '+(o.fotos||[]).length+'</p><p>Recomendado por el mecánico: '+h(o.pedido||'—')+'</p><p>Firma del cliente: ______________________ &nbsp;&nbsp; Firma del taller: ______________________</p>')+
 '<p class="sm" style="border-top:1px solid #999;padding-top:6px">Comprobante interno sin validez fiscal. '+vbLine()+'</p>')};

 '<div class="chips" style="margin-bottom:8px"><span class="badge warn">Pendiente</span><span class="badge ok">Confirmado</span><span class="badge b-Diagnóstico">En taller</span></div><div class="tw" style="padding:0">'+g+'</div>'};

CHG.tufecha=t=>{if(t.value){UI.turFecha=t.value;renderView()}};
ACT.tunew=d=>{const hr=+d.h||9,rc=+d.r||0;
 modal({title:'Nuevo turno · '+fdate(UI.turFecha),ok:'Agendar',wide:true,body:pickerHTML('','')+
 '<div class="g4"><div class="f"><label for="tu_f">Fecha</label><input type="date" id="tu_f" value="'+UI.turFecha+'"></div><div class="f"><label for="tu_h">Hora</label><select id="tu_h">'+opts(HORAS,hr,x=>[x,String(x).padStart(2,'0')+':00'])+'</select></div><div class="f"><label for="tu_d">Duración (h)</label><select id="tu_d">'+opts([1,2,3,4,5,6],1)+'</select></div><div class="f"><label for="tu_r">Puesto</label><select id="tu_r">'+opts(RECURSOS.map((r,i)=>[i,r]),rc,x=>x)+'</select></div></div>'+

/* ----- Fichas técnicas: códigos, equivalencias y dimensiones (modelo del catálogo WEGA: Equivalencias + Dimensiones) ----- */
const repCodes=r=>[r.cod,r.codProv].concat(r.cods||[]).filter(Boolean);
function repHay(r){return norm([repCodes(r).join(' '),r.desc,r.marca,r.rubro,r.rosca,r.junta,r.apl,r.oem,(r.eq||[]).map(e=>e.m+' '+e.c).join(' '),r.alto,r.dext,r.dint,r.largo,r.ancho].join(' '))}
const TECH=[['cod','Código principal'],['codProv','Código del proveedor'],['cods','Otros códigos'],['eq','Equivalencias'],['oem','OEM'],['largo','Largo'],['ancho','Ancho'],['alto','Alto'],['dext','Diámetro exterior'],['dint','Diámetro interior'],['rosca','Rosca'],['junta','Junta'],['valv','Válvula'],['picos','Picos'],['obs','Observaciones'],['apl','Aplicación']];
function techStr(r,k){const v=r[k];if(k==='cods')return(v||[]).join(' | ');if(k==='eq')return(v||[]).map(e=>e.m+':'+e.c).join(' | ');return String(v==null?'':v)}
function applyTech(r,ch,src,ver){r.hist=r.hist||[];const before={};TECH.forEach(k=>before[k[0]]=techStr(r,k[0]));Object.assign(r,ch);let n=0;
 if(ver){r.fVerif=TODAY();r.fuente='catalogo'}
 TECH.forEach(k=>{const a=techStr(r,k[0]);if(a!==before[k[0]]){n++;r.hist.unshift({t:Date.now(),u:ME?ME.n:'sistema',campo:k[1],antes:before[k[0]],desp:a,fuente:src})}});
 if(!n&&ver)r.hist.unshift({t:Date.now(),u:ME.n,campo:'Verificación contra catálogo',antes:'',desp:'Sin cambios',fuente:src});
 if(r.hist.length>200)r.hist.length=200;return n}
function equivOf(r){const mine=repCodes(r).map(ncode),out=[];
 DB.repuestos.forEach(x=>{if(x===r||!x.activo)return;const theirs=repCodes(x).map(ncode);
  const decl=(r.eq||[]).some(e=>theirs.indexOf(ncode(e.c))>=0)||(x.eq||[]).some(e=>mine.indexOf(ncode(e.c))>=0);
  if(decl){out.push({r:x,tipo:'decl',txt:'Equivalencia declarada'});return}
  if(x.rubro===r.rubro&&r.rosca&&r.junta&&ncode(r.rosca)===ncode(x.rosca)&&ncode(r.junta)===ncode(x.junta)){
   if(r.alto&&x.alto&&Math.abs(num(r.alto)-num(x.alto))>1)return;
   out.push({r:x,tipo:'dim',txt:'Misma rosca y junta'+(r.alto&&x.alto?' · altura coincide':' · verificar altura')})}});
 return out.sort((a,b)=>(a.tipo==='decl'?0:1)-(b.tipo==='decl'?0:1)||b.r.qty-a.r.qty)}
function codeClash(codes,self){return DB.repuestos.find(x=>x!==self&&x.activo&&repCodes(x).some(c=>codes.some(a=>ncode(a)&&ncode(a)===ncode(c))))}
function wegaUrl(r){const s=String(r.desc||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');return s?'https://wega.com.ar/catalogo/filtros/detalle/'+s:'https://wega.com.ar/catalogo'}
const FUENTES=[['','— sin indicar —'],['catalogo','Catálogo WEGA'],['taller','Dato del taller'],['proveedor','Lista del proveedor'],['ejemplo','Ejemplo sin verificar']];
function verBadge(r){if(r.fVerif){const d=-daysTo(r.fVerif);return '<span class="badge '+(d>180?'warn':'ok')+'">'+(d>180?'Revisar contra catálogo · verificado ':'Verificado con catálogo ')+fdate(r.fVerif)+'</span>'}
 return '<span class="badge">'+(r.fuente==='taller'?'Dato del taller · sin verificar con catálogo':r.fuente==='ejemplo'?'Dato de ejemplo · sin verificar':r.fuente==='proveedor'?'Lista del proveedor · sin verificar':'Sin verificar con catálogo')+'</span>'}

function repFiltered(){const q=norm(UI.repQ),nc=ncode(UI.repQ);return DB.repuestos.filter(r=>(UI.repInact||r.activo)&&(!UI.repRub||r.rubro===UI.repRub)&&(!UI.repProv||r.provId===UI.repProv)&&(!UI.repSinVer||!r.fVerif)&&(!q||repHay(r).includes(q)||(nc&&repCodes(r).some(c=>ncode(c).includes(nc)))))}
function repDetHTML(r){
 if(!r)return '<div class="det"><p class="mut" style="margin:0">Seleccioná un artículo de la lista para ver códigos, dimensiones, equivalencias y trazabilidad.</p></div>';

 return '<div class="det"><div class="row"><b style="font-size:1.05rem">'+h(r.desc)+' · '+h(r.marca)+'</b>'+verBadge(r)+'<span class="sp"></span><button class="btn s" data-act="reptraza" data-id="'+r.id+'">🔎 Trazabilidad</button>'+(isBoss()?'<button class="btn s" data-act="repajuste">Ajustar stock</button>':'')+'</div>'+

 '<div><label>Reposición / alarma</label><b>'+r.repos+' / '+r.alarma+'</b>'+(r.venc?' · vence '+fdate(r.fvenc):'')+'</div>'+
 '<div><label>Catálogo WEGA</label><a href="'+h(wegaUrl(r))+'" target="_blank" rel="noopener">Abrir ficha de '+h(r.desc)+'</a><br><a href="https://wega.com.ar/catalogo" target="_blank" rel="noopener">Catálogo WEGA</a></div></div>'+
 '<label style="margin-top:8px">Dimensiones (según catálogo)</label><div class="dg">'+dims.map(d=>'<div><label>'+d[0]+'</label><b>'+h(d[1]||'—')+'</b></div>').join('')+'</div>'+(r.obs?'<div class="sm mut" style="margin-top:4px">Observaciones: '+h(r.obs)+'</div>':'')+
 '<label style="margin-top:8px">Equivalencias declaradas / OEM</label><div>'+((r.eq||[]).length?(r.eq).map(e=>{const x=DB.repuestos.find(y=>y.activo&&repCodes(y).some(c=>ncode(c)===ncode(e.c)));return '<span class="pill">'+h(e.m)+' · '+h(e.c)+'</span>'+(x?' <button class="btn s" data-act="repsel" data-id="'+x.id+'">ver en inventario</button>':'')}).join(' '):'<span class="mut">—</span>')+(r.oem?'<br>OEM: '+h(r.oem):'')+'</div>'+
 '<label style="margin-top:8px">Equivalentes disponibles en el inventario</label><div>'+(eq.length?eq.map(e=>'<div class="row sm" style="padding:3px 0"><span class="pill">'+h(e.r.desc+' · '+e.r.marca)+'</span><span>stock <b>'+e.r.qty+'</b></span>'+(pp?'<span>'+fmt(e.r.pv)+'</span>':'')+'<span class="mut">'+h(e.txt)+'</span><button class="btn s" data-act="repsel" data-id="'+e.r.id+'">Ver</button></div>').join(''):'<span class="mut">No hay equivalentes cargados.</span>')+'</div>'+
 '<label style="margin-top:8px">Aplicación (vehículos compatibles)</label><div style="white-space:pre-line">'+h(r.apl||'—')+'</div></div>'}
V.repuestos=()=>{const l=repFiltered(),pc=canCost(),pp=canPrice(),sel=repOf(UI.repSel),bajo=DB.repuestos.filter(r=>r.activo&&r.qty<=r.alarma).length;

ACT.repfimp=()=>{if(!isBoss())return;modal({title:'Importar fichas técnicas (equivalencias y dimensiones)',wide:true,ok:'Analizar y aplicar',body:
 '<p class="sm mut">No hay API pública del catálogo para conectar de forma automática <b>[VERIFICAR con WEGA]</b>. Alternativa: copiá los datos de la ficha en un CSV con estas columnas y cargalo acá. Sólo se actualizan las celdas con valor; cada cambio queda en la trazabilidad y el artículo se marca como verificado hoy.</p><p class="sm"><code>'+FCOLS.join(';')+'</code><br><span class="mut">equivalencias: <code>MARCA:CODIGO|MARCA:CODIGO</code> · otros_codigos y aplicacion separados por <code>|</code> · el código identifica al artículo por cualquiera de sus códigos.</span></p>'+
 '<div class="row"><label class="btn s filebtn">📁 Cargar archivo CSV<input type="file" accept=".csv,text/csv,text/plain" hidden id="fi_file" data-chg="fifile"></label><button class="btn s" data-act="repfexp" type="button">⬇ Descargar plantilla con mis datos</button></div><textarea id="fi_t" style="min-height:150px;margin-top:8px" aria-label="Contenido del CSV"></textarea>',
 onOk:()=>{const rows=parseCSV(val('fi_t'));if(rows.length<2){merr('Pegá el encabezado y al menos una fila.');return false}
  const hd=rows[0].map(x=>norm(x).replace(/[^a-z_]/g,''));const ix=k=>hd.indexOf(k);if(ix('codigo')<0){merr('Falta la columna “codigo”.');return false}
  const plan=[],bad=[];
  rows.slice(1).forEach((rw,n)=>{const g=k=>ix(k)<0?'':String(rw[ix(k)]==null?'':rw[ix(k)]).trim();const cd=g('codigo');const r=cd&&DB.repuestos.find(x=>x.activo&&repCodes(x).some(c=>ncode(c)===ncode(cd)));if(!r){bad.push(cd||'(fila '+(n+2)+')');return}
   const ch={};let err='';const set=(k,v)=>{if(v!=='')ch[k]=v};
   [['largo','largo'],['ancho','ancho'],['alto','alto'],['dext','diam_ext'],['dint','diam_int']].forEach(p=>{const v=g(p[1]);if(v){if(!/^\d+([.,]\d+)?$/.test(v))err='dimensión no numérica en '+p[1];else ch[p[0]]=v.replace(',','.')}});
   set('rosca',g('rosca'));set('junta',g('junta'));set('valv',g('valvula'));set('picos',g('picos'));set('obs',g('observaciones'));set('oem',g('oem'));
   const eqs=g('equivalencias');if(eqs){const arr=[];eqs.split('|').forEach(p=>{const i=p.indexOf(':');if(i<1||!p.slice(i+1).trim())err='equivalencias con formato inválido';else arr.push({m:p.slice(0,i).trim().toUpperCase(),c:p.slice(i+1).trim()})});if(!err)ch.eq=arr}
   const oc=g('otros_codigos');if(oc){const arr=oc.split('|').map(x=>x.trim()).filter(Boolean);const own=[r.cod,r.codProv].map(ncode);if(arr.some(c=>own.indexOf(ncode(c))>=0))err='otro código repite el principal';else if(codeClash(arr,r))err='otro código pertenece a otro artículo';else ch.cods=arr}
   const ap=g('aplicacion');if(ap)ch.apl=ap.split('|').map(x=>x.trim()).filter(Boolean).join('\n');
   if(err){bad.push(cd+' ('+err+')');return}plan.push({r,ch})});
  if(!plan.length){merr('Ninguna fila se puede aplicar. Problemas: '+bad.slice(0,6).join(', '));return false}
  if(!confirm('Se actualizarán '+plan.length+' fichas técnicas'+(bad.length?' · no se aplican '+bad.length+' filas: '+bad.slice(0,5).join(', '):'')+'. ¿Aplicar?'))return false;
  let cambios=0;plan.forEach(p=>{cambios+=applyTech(p.r,p.ch,'Importación de catálogo WEGA (CSV)',true)});
  audit('Fichas técnicas importadas',plan.length+' artículos · '+cambios+' campos');save();closeModal();renderView();toast(plan.length+' fichas actualizadas · '+cambios+' campos cambiados'+(bad.length?' · '+bad.length+' sin aplicar':''),bad.length>0);return false}})};
function snapPrecios(){DB.undoPrecios=DB.repuestos.map(r=>({id:r.id,pc:r.pc,gan:r.gan,pv:r.pv,pAnt:r.pAnt,fAct:r.fAct}))}
ACT.repmasivo=()=>{modal({title:'Modificación masiva de precios',ok:'Aplicar',body:'<div class="g2"><div class="f"><label for="mp_a">Alcance</label><select id="mp_a" data-chg="mpcalc"><option value="all">Todos los artículos activos</option><option value="rub">Un rubro</option><option value="prov">Un proveedor</option><option value="marca">Una marca</option></select></div><div class="f"><label for="mp_v">Valor del alcance</label><select id="mp_v" data-chg="mpcalc"></select></div><div class="f"><label for="mp_p">Porcentaje (+ aumenta, − baja)</label><input id="mp_p" inputmode="decimal" placeholder="Ej.: 12,5" data-chg="mpcalc"></div><div class="f"><label for="mp_b">Se aplica sobre</label><select id="mp_b"><option value="compra">Precio de compra (recalcula venta con el % de ganancia)</option><option value="venta">Precio de venta directo</option></select></div></div><div id="mp_r" class="demoflag" style="background:#eef6ff;border-color:#b9d6f7;color:#12406f"></div>',calc:()=>CHG.mpcalc({id:'mp_a'}),
 onOk:()=>{const p=num(val('mp_p'));if(!val('mp_p').trim()||p===0){merr('Ingresá un porcentaje distinto de cero.');return false}if(p<=-90||p>500){merr('Porcentaje fuera de rango (−90 % a 500 %).');return false}const l=mpSet();if(!l.length){merr('El alcance no tiene artículos.');return false}
  snapPrecios();l.forEach(r=>{r.pAnt=r.pv;r.fAct=TODAY();if(val('mp_b')==='compra'){r.pc=r2(r.pc*(1+p/100));r.pv=r2(r.pc*(1+r.gan/100))}else{r.pv=r2(r.pv*(1+p/100));r.gan=r.pc>0?r2((r.pv/r.pc-1)*100):r.gan}});
  audit('Precios masivos',l.length+' artículos '+p+'%');save();closeModal();renderView();toast(l.length+' precios actualizados · podés revertir');return false}})};
function mpSet(){const a=val('mp_a'),v=val('mp_v');return DB.repuestos.filter(r=>r.activo&&(a==='all'||(a==='rub'&&r.rubro===v)||(a==='prov'&&r.provId===v)||(a==='marca'&&r.marca===v)))}
CHG.mpcalc=t=>{if(t.id==='mp_a'){const a=val('mp_a'),s=$('#mp_v');s.disabled=a==='all';s.innerHTML=a==='rub'?opts(DB.rubrosRep,'',x=>[x,x]):a==='prov'?opts(DB.provs,'',p=>[p.id,p.n]):a==='marca'?opts(DB.marcas,'',x=>[x,x]):'<option value="">—</option>'}
 const p=num(val('mp_p'));$('#mp_r').innerHTML='Alcanza a <b>'+mpSet().length+'</b> artículos'+(p?' · variación '+(p>0?'+':'')+p+' %':'')};
ACT.reprevert=()=>{if(!DB.undoPrecios)return;confirmBox('Se restauran los precios previos a la última modificación masiva. ¿Confirmás?',()=>{DB.undoPrecios.forEach(s=>{const r=repOf(s.id);if(r)Object.assign(r,{pc:s.pc,gan:s.gan,pv:s.pv,pAnt:s.pAnt,fAct:s.fAct})});DB.undoPrecios=null;audit('Precios revertidos');save();renderView();toast('Precios restaurados')},'Revertir')};
ACT.repingpre=()=>{modal({title:'Ingresar precios de compra (lista del proveedor)',ok:'Aplicar',body:'<p class="sm mut">Una línea por artículo: <code>código;precio de compra</code>. Se recalcula el precio de venta con el % de ganancia de cada artículo.</p><textarea id="ip_t" style="min-height:140px" placeholder="7798001699226;3900&#10;7798001694979;3950"></textarea>',
 onOk:()=>{const L=val('ip_t').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!L.length){merr('Pegá al menos una línea.');return false}const bad=[],ok=[];
  L.forEach(x=>{const p=x.split(/[;\t]/);const r=DB.repuestos.find(y=>y.cod===(p[0]||'').trim());const pr=num(p[1]);if(!r||!(pr>0))bad.push(x);else ok.push([r,pr])});
  if(!ok.length){merr('Ninguna línea coincide con un código existente.');return false}snapPrecios();ok.forEach(([r,pr])=>{r.pAnt=r.pv;r.fAct=TODAY();r.pc=r2(pr);r.pv=r2(pr*(1+r.gan/100))});audit('Ingreso de precios',ok.length+' artículos');save();closeModal();renderView();toast(ok.length+' precios actualizados'+(bad.length?' · '+bad.length+' líneas sin coincidencia':''),bad.length>0);return false}})};
ACT.replist=()=>{const l=repFiltered().filter(r=>r.activo);printHTML('<div class="hdr"><img src="'+LOGO+'" alt=""><div><h1 style="margin:0">Listado de artículos</h1>'+h(DB.cfg.nombre)+' · '+fdate(TODAY())+'</div></div><table><thead><tr><th>Código</th><th>Descripción</th><th>Marca</th><th>Rubro</th><th>Rosca</th><th>Junta</th><th>P. venta</th><th>Stock</th></tr></thead><tbody>'+l.map(r=>'<tr><td>'+h(r.cod)+'</td><td>'+h(r.desc)+'</td><td>'+h(r.marca)+'</td><td>'+h(r.rubro)+'</td><td>'+h(r.rosca)+'</td><td>'+h(r.junta)+'</td><td>'+fmt(r.pv)+'</td><td>'+r.qty+'</td></tr>').join('')+'</tbody></table><p class="sm">'+vbLine()+'</p>')};
ACT.repcsv=()=>{csvDown('repuestos_'+TODAY()+'.csv',[['Código','Cód. proveedor','Otros códigos','Descripción','Marca','Rubro','Proveedor','P. compra','% ganancia','P. venta','IVA','Stock','Alarma','Reposición','Rosca','Junta','Aplicación']].concat(repFiltered().map(r=>[r.cod,r.codProv,(r.cods||[]).join(' | '),r.desc,r.marca,r.rubro,(provOf(r.provId)||{}).n,r.pc,r2(r.gan),r.pv,r.iva,r.qty,r.alarma,r.repos,r.rosca,r.junta,r.apl.replace(/\n/g,' / ')])))};
ACT.repfalt=()=>{const l=DB.repuestos.filter(r=>r.activo&&r.qty<=r.alarma).sort((a,b)=>(provOf(a.provId).n).localeCompare(provOf(b.provId).n));if(!l.length){toast('No hay faltantes.');return}csvDown('faltantes_'+TODAY()+'.csv',[['Proveedor','Código','Descripción','Marca','Stock','Reposición','A pedir']].concat(l.map(r=>[(provOf(r.provId)||{}).n,r.cod,r.desc,r.marca,r.qty,r.repos,Math.max(0,r.repos-r.qty)])))};
document.addEventListener('keydown',e=>{if(!ME||VIEW!=='repuestos'||!$('#modal').hidden||!isBoss())return;if(e.key==='F1'){e.preventDefault();ACT.repedit({id:''})}else if(e.key==='F2'&&UI.repSel){e.preventDefault();ACT.repedit({id:UI.repSel})}else if(e.key==='F3'&&UI.repSel){e.preventDefault();ACT.repdel()}});
