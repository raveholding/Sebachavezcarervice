<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SebaChavez Car Service · Sistema VB</title>
<meta name="theme-color" content="#2b2f36">
<style>
:root{--rojo:#e53935;--azul:#1e6fd0;--grafito:#3a3d43;--noche:#23262b;--bg:#f2f4f7;--card:#fff;--bd:#dfe3e8;--tx:#1d2127;--mut:#667085;--ok:#1f9d55;--warn:#d98b0a;--bad:#d32f2f;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0 0 .4em;line-height:1.2}
h2{font-size:1.25rem}h3{font-size:1.02rem}
.hide,[hidden]{display:none!important}
.mut{color:var(--mut)}.sm{font-size:.86rem}.r{text-align:right}.c{text-align:center}.b{font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.g2>*,.g3>*,.g4>*,.card{min-width:0}
.btn{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:8px 14px;min-height:40px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--tx)}
.btn:hover{border-color:#b9c0ca;background:#f7f8fa}
.btn.p{background:var(--azul);border-color:var(--azul);color:#fff}.btn.p:hover{background:#1859ab}
.btn.d{background:var(--rojo);border-color:var(--rojo);color:#fff}.btn.d:hover{background:#c62828}
.btn.s{min-height:32px;padding:4px 10px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input,select,textarea{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;background:#fff;width:100%;min-height:40px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:2px solid var(--azul);outline-offset:1px}
label{display:block;font-size:.82rem;font-weight:600;color:var(--mut);margin:0 0 3px}
.f{margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:14px}
.card h3{margin-bottom:8px}
/* login */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#fff 0%,#eef2f8 60%,#e7edf7 100%)}
.lbox{width:100%;max-width:560px;background:#fff;border:1px solid var(--bd);border-radius:16px;padding:22px;box-shadow:0 10px 40px rgba(20,30,50,.08)}
.lbox .logo{display:block;margin:0 auto 6px;width:150px;height:auto}
.ucard{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--bd);background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;min-height:52px}
.ucard:hover{border-color:var(--azul);background:#f5f9ff}
.av{width:36px;height:36px;border-radius:50%;background:var(--grafito);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.pbanner{background:#7a5400;color:#fff;text-align:center;font-size:.82rem;padding:5px 8px;position:sticky;top:0;z-index:30}.pbanner a{color:#ffe7a8}
.demoflag{background:#fff6e0;border:1px solid #f1d38a;color:#7a5400;border-radius:8px;padding:8px 10px;font-size:.84rem;margin:10px 0}
/* VB banner */
.vb{background:linear-gradient(120deg,#1b1d21,#2c2f35);color:#fff;border-radius:12px;padding:14px;margin-top:14px}
.vb b{color:#ff8a1f}
.vb .lema{font-style:italic;color:#d6d9de;font-size:.9rem}
.vbb{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.vbb a{flex:1;min-width:110px;min-height:48px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;font-weight:700;text-decoration:none;color:#fff;background:#ff7a00;padding:0 14px}
.vbb a.w{background:#25a244}.vbb a.t{background:#3c6fd6}.vbb a.m{background:#ff7a00}
.vbl{font-size:.78rem;color:#9aa1ab;text-align:center;padding:6px}
/* app */
#app{display:flex;min-height:100vh}
#side{width:236px;background:var(--noche);color:#e6e8ec;flex:none;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
#side .brand{padding:14px 12px 8px;text-align:center;background:#fff}
#side .brand img{width:96px;height:auto;display:block;margin:0 auto}
#side nav{padding:8px;flex:1}
#side nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#cfd3da;padding:10px 12px;border-radius:8px;cursor:pointer;min-height:42px}
#side nav button:hover{background:#2f333a}
#side nav button.on{background:var(--azul);color:#fff;font-weight:700}
#side .badge2{margin-left:auto;background:var(--rojo);color:#fff;border-radius:999px;font-size:.72rem;padding:1px 7px}
#side .who{padding:10px 12px;border-top:1px solid #343840;font-size:.84rem}
#side .vbs{padding:8px 12px 12px;font-size:.72rem;color:#8f96a1}
#side .vbs a{color:#ff9a3d}
#main{flex:1;min-width:0}
#top{display:none;background:var(--noche);color:#fff;padding:8px 12px;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
#top button{background:none;border:1px solid #555;color:#fff;border-radius:8px;min-width:44px;min-height:40px;font-size:1.1rem}
#view{padding:18px;max-width:1500px}
@media(max-width:900px){#side{position:fixed;left:-250px;top:0;z-index:30;transition:left .2s}#side.open{left:0}#top{display:flex}#view{padding:12px}}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar h2{margin:0 12px 0 0}
/* tables */
.tw{overflow:auto;border:1px solid var(--bd);border-radius:var(--r);background:#fff}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid #edf0f3;text-align:left;vertical-align:top;font-size:.92rem}
th{background:#f6f8fa;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:#5a6472;position:sticky;top:0;white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
tr.clk{cursor:pointer}tr.clk:hover td{background:#f5f9ff}
tr.sel td{background:#d9ecff}
tr.low td{background:#fff3c4}
tr.off td{opacity:.5}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.76rem;font-weight:700;background:#e9edf2;color:#44505e;white-space:nowrap}
.b-Recibido{background:#e7eefb;color:#1d4ea0}.b-Diagnóstico{background:#efe6fb;color:#5b2ea6}.b-Presupuesto{background:#fff0d6;color:#8a5a00}
.b-En\ reparación{background:#ffe3e0;color:#b3261e}.b-Listo{background:#dff5e7;color:#1b7a43}.b-Entregado{background:#e9edf2;color:#56606d}
.ok{background:#dff5e7;color:#1b7a43}.warn{background:#fff0d6;color:#8a5a00}.bad{background:#ffe3e0;color:#b3261e}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:12px;cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--azul)}
.kpi .v{font-size:1.55rem;font-weight:800;line-height:1.1}.kpi .l{font-size:.8rem;color:var(--mut);font-weight:600}
.kpi.bad .v{color:var(--bad)}.kpi.okk .v{color:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.86rem;font-weight:600;min-height:34px}
.chip.on{background:var(--grafito);color:#fff;border-color:var(--grafito)}
/* kanban */
.kan{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:10px;overflow:auto;padding-bottom:8px}
.kcol{background:#e9edf2;border-radius:10px;padding:8px;min-height:140px}
.kcol h4{margin:2px 4px 8px;font-size:.84rem;text-transform:uppercase;letter-spacing:.04em;color:#4a5461;display:flex;justify-content:space-between}
.kc{background:#fff;border:1px solid var(--bd);border-left:4px solid var(--azul);border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:pointer}
.kc:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.kc .pat{font-weight:800;letter-spacing:.06em}
.kc.deuda{border-left-color:var(--rojo)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(15,20,30,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto}
.mbox{background:#fff;border-radius:14px;width:100%;max-width:620px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mbox.wide{max-width:980px}
.mh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:#fff;border-radius:14px 14px 0 0;z-index:2}
.mh h3{margin:0;flex:1}
.mb{padding:16px}
.mf{padding:12px 16px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:#fafbfc;border-radius:0 0 14px 14px}
.err{background:#ffe3e0;color:#9b1c14;border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:.9rem}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#23262b;color:#fff;padding:10px 16px;border-radius:10px;z-index:90;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#toast.bad{background:#b3261e}
/* turnos grid */
.tg{display:grid;grid-template-columns:60px repeat(5,minmax(150px,1fr));min-width:900px;border:1px solid var(--bd);background:#fff;border-radius:10px;overflow:hidden}
.tg .hd{background:#f6f8fa;font-weight:700;font-size:.8rem;padding:8px;border-bottom:1px solid var(--bd);border-left:1px solid #edf0f3}
.tg .hr{padding:6px;font-size:.8rem;color:var(--mut);border-bottom:1px solid #edf0f3;height:56px}
.tg .cell{border-bottom:1px solid #edf0f3;border-left:1px solid #edf0f3;height:56px;cursor:pointer;position:relative}
.tg .cell:hover{background:#f0f6ff}
.tb{position:absolute;left:2px;right:2px;top:2px;border-radius:6px;padding:4px 6px;font-size:.78rem;overflow:hidden;color:#fff;background:var(--azul);z-index:1;cursor:pointer}
.tb.Confirmado{background:#1f9d55}.tb.Pendiente{background:#d98b0a}.tb.Taller{background:#6a3fc0}.tb.Cancelado{background:#8a8f98;text-decoration:line-through}
.pbar{height:10px;background:#e3e7ec;border-radius:99px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--ok)}
.hbar{height:16px;background:var(--azul);border-radius:4px;min-width:2px}
.itbl input,.itbl select{min-height:34px;padding:4px 6px}
.det{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:10px}
.pill{display:inline-block;background:#eef1f5;border-radius:6px;padding:1px 7px;font-size:.8rem}
#printArea{display:none}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.dg>div{background:#f6f8fa;border-radius:8px;padding:6px 8px;min-width:0}.dg label{margin:0;font-size:.7rem}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:96px;height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--bd);cursor:zoom-in;background:#eef1f5}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .btn{position:absolute;top:2px;right:2px;min-height:26px;padding:0 7px;background:rgba(255,255,255,.92)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
#lb img{max-width:100%;max-height:100%;border-radius:8px}
.filebtn{position:relative;margin:0;cursor:pointer}
.inl{width:96px;min-height:34px;padding:4px 6px;text-align:right}
.cr input,.er input{min-height:36px}
.steps{font-size:.8rem;color:var(--mut);margin-top:6px}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important;padding:0;color:#000;background:#fff}#printArea table th{position:static}}
.pa h1{font-size:1.3rem}.pa .hdr{display:flex;gap:14px;align-items:center;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px}.pa .hdr img{width:80px}
.pa td,.pa th{border:1px solid #999;font-size:.85rem}
</style>
</head>

async function hashPin(pin,salt){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sbcs|'+salt+'|'+pin));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let x=5381;const s='sbcs|'+salt+'|'+pin;for(let i=0;i<s.length;i++)x=((x*33)^s.charCodeAt(i))>>>0;return 'f'+x.toString(16)}}
async function setPin(u,pin){u.salt=uid('s');u.pin=await hashPin(pin,u.salt)}

/* Reglas de la reunión con el cliente:
   · El mecánico NO ve precios ni valores, ni el presupuesto. Da el diagnóstico (con fotos), confirma la reparación y entrega al jefe/dueño.
   · El presupuesto lo arma y entrega el dueño o el jefe de taller; el cliente lo aprueba SIN cobrar.
   · Se cobra al entregar el vehículo (se pueden sumar adicionales, p. ej. focos, hasta ese momento).
   · La mano de obra se puede editar en el momento (valor y cantidad). */
const otVisible=o=>{if(!ME||ME.rol!=='mecanico')return true;return o.mecId===ME.id||(!o.mecId&&(o.estado==='Recibido'||o.estado==='Diagnóstico'))};

  check:check||{aceite:true,luces:true,neum:true,rayones:false,auxilio:true,docs:true,comb:'1/2'},obs:'',pedido:'',fotos:[],pagos:[],entregada:'',arca:arca||{cond:cl.cond||'CF',doc:cl.doc||''}};
 DB.ots.unshift(o);return o}

/* ---- fotos del diagnóstico ---- */
function imgCompress(file,max,q){return new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=rd.result};rd.onerror=rej;rd.readAsDataURL(file)})}
CHG.otfoto=t=>{const o=otOf(t.dataset.id);const files=[...(t.files||[])];t.value='';if(!o||o.estado==='Entregado'||!files.length)return;
 if(!(isBoss()||(ME.rol==='mecanico'&&otVisible(o)))){toast('No podés cargar fotos en esta orden.',1);return}
 if(o.fotos.length+files.length>6){toast('Máximo 6 fotos por orden.',1);return}
 files.forEach(f=>{if(!/^image\//.test(f.type)){toast('“'+f.name+'” no es una imagen.',1);return}
  imgCompress(f,1280,.68).then(data=>{if(o.fotos.length>=6)return;o.fotos.push({id:uid('f'),n:f.name.slice(0,40),data,t:Date.now(),u:ME.n});audit('Foto de diagnóstico',otNum(o)+' · '+f.name.slice(0,30));otRefresh(o)}).catch(()=>toast('No se pudo leer la imagen.',1))})};
ACT.fotover=d=>{const o=otOf(d.id),f=o&&o.fotos.find(x=>x.id===d.f);if(!f)return;const old=$('#lb');if(old)old.remove();const lb=document.createElement('div');lb.id='lb';lb.setAttribute('role','dialog');lb.setAttribute('aria-label','Foto ampliada');lb.innerHTML='<img src="'+f.data+'" alt="Foto ampliada del diagnóstico">';lb.addEventListener('click',()=>lb.remove());document.body.appendChild(lb)};
ACT.fotodel=d=>{const o=otOf(d.id);if(!o||o.estado==='Entregado')return;const f=o.fotos.find(x=>x.id===d.f);if(!f||!(isBoss()||f.u===ME.n))return;o.fotos.splice(o.fotos.indexOf(f),1);audit('Foto quitada',otNum(o));otRefresh(o)};

/* ---- cobrar y entregar (al final, con la posibilidad de haber sumado adicionales) ---- */
function pgCalc(o){const t=otTotal(o),c=cliOf(o.cliId);const ef=r2(num(val('pg_ef'))),tr=r2(num(val('pg_tr'))),tj=r2(num(val('pg_tj'))),pt=r2(num(val('pg_pt')));let cc=r2(num(val('pg_cc')));
 if([ef,tr,tj,cc,pt].some(x=>x<0))return{err:'No se admiten importes negativos.'};
 if(r2(tr+tj+pt)>t.saldo+0.004)return{err:'Transferencia + tarjeta superan el saldo ('+fmt(t.saldo)+').'};
 let efA,vuelto;
 if(chk('pg_ccrest')){efA=r2(Math.min(ef,Math.max(0,t.saldo-tr-tj-pt)));vuelto=r2(ef-efA);cc=r2(t.saldo-tr-tj-pt-efA)}
 else{if(r2(tr+tj+pt+cc)>t.saldo+0.004)return{err:'Transferencia + tarjeta + cuenta corriente superan el saldo ('+fmt(t.saldo)+').'};efA=r2(Math.min(ef,Math.max(0,t.saldo-tr-tj-pt-cc)));vuelto=r2(ef-efA)}
 if(cc>0.004&&(!c||!c.cc))return{err:'El cliente no tiene cuenta corriente habilitada.'};
 if(cc>0.004&&c.saldo+cc>c.lim+0.004)return{err:'Supera el límite de cuenta corriente del cliente ('+fmt(c.lim)+').'};
 if(pt>0.004){if(!c||!c.club)return{err:'El cliente no es socio del Club.'};if(pt>ptsPesos(c.pts)+0.004)return{err:'Los puntos alcanzan para '+fmt(ptsPesos(c.pts))+'.'}}
 return{ef:efA,tr,tj,pt,cc:r2(cc),vuelto,total:r2(efA+tr+tj+pt+cc),resta:r2(t.saldo-efA-tr-tj-pt-cc)}}
CHG.pgdesc=()=>{const o=otOf(UI.cobroOt);if(!o)return;const tp=val('pg_dt'),v=num(val('pg_dv'));let msg='';o.sinIva=!chk('pg_iva');
 if(!tp||!(v>0))o.desc=null;else{const bt=otTotal(Object.assign({},o,{desc:null})).total;if(!(bt>0)){o.desc=null;msg='Esta orden no tiene importe para descontar.'}else if(tp==='%'&&v>100){o.desc=null;msg='El descuento no puede superar el 100 %.'}else if(tp==='$'&&v>bt+0.004){o.desc=null;msg='El descuento no puede superar el total ('+fmt(bt)+').'}else o.desc={t:tp,v:v}}
 const t=otTotal(o);const e=$('#pg_tot');if(e)e.textContent=fmt(t.saldo);const di=$('#pg_dinfo');if(di)di.textContent=msg||(t.desc>0?'Descuento aplicado: −'+fmt(t.desc)+' sobre el total ('+fmt(t.bruto)+'). ':'')+(o.sinIva?'Sin IVA.':'Con IVA.');CHG.pgcalc()};

function finEntrega(o){o.estado='Entregado';o.entregada=TODAY();o.entregadaPor=ME.n;const v=vehOf(o.vehId);if(v){v.km=Math.max(v.km||0,o.km||0);if(v.km){v.proxKm=Math.ceil((v.km+1000)/10000)*10000;v.proxFecha=addDays(180)}}
 o.items.forEach(i=>{if(i.k!=='rep')return;const r=repOf(i.repId);if(!r)return;let tipo='',cant=0,u='u';
  if(r.rubro==='ACEITE LUBRICANTE'){tipo='Aceite usado';cant=i.qty*(/x\s*(\d+)\s*L/i.test(r.desc)?+RegExp.$1:4);u='L'}
  else if(r.rubro==='FILTRO DE ACEITE'){tipo='Filtros usados';cant=i.qty}else if(r.rubro==='BATERÍAS'){tipo='Baterías';cant=i.qty}
  if(tipo)DB.resid.push({id:uid('z'),fecha:TODAY(),tipo,cant,unidad:u,ref:'Generado en '+otNum(o)})});
 const tu=DB.turnos.find(x=>x.otId===o.id);if(tu)tu.estado='Confirmado';
 audit('OT entregada y cobrada',otNum(o)+' · '+fmt(otTotal(o).total))}
ACT.otentregar=d=>{const o=otOf(d.id);if(!o)return;
 if(!canCharge()){toast('La entrega y el cobro los hacen el dueño o el jefe de taller.',1);return}
 if(o.estado!=='Listo'){toast('Para entregar, la reparación debe estar confirmada por el mecánico (estado “Listo”).',1);return}
 const c=cliOf(o.cliId),t=otTotal(o);UI.cobroOt=o.id;UI.cobroOk=false;const snap={desc:o.desc?Object.assign({},o.desc):null,sinIva:!!o.sinIva};

function techStr(r,k){const v=r[k];if(k==='cods')return(v||[]).join(' | ');if(k==='eq')return(v||[]).map(e=>e.m+':'+e.c).join(' | ');return String(v==null?'':v)}
function applyTech(r,ch,src,ver){r.hist=r.hist||[];const before={};TECH.forEach(k=>before[k[0]]=techStr(r,k[0]));Object.assign(r,ch);let n=0;
 if(ver){r.fVerif=TODAY();r.fuente='catalogo'}
 TECH.forEach(k=>{const a=techStr(r,k[0]);if(a!==before[k[0]]){n++;r.hist.unshift({t:Date.now(),u:ME?ME.n:'sistema',campo:k[1],antes:before[k[0]],desp:a,fuente:src})}});
 if(!n&&ver)r.hist.unshift({t:Date.now(),u:ME.n,campo:'Verificación contra catálogo',antes:'',desp:'Sin cambios',fuente:src});
 if(r.hist.length>200)r.hist.length=200;return n}
function equivOf(r){const mine=repCodes(r).map(ncode),out=[];
 DB.repuestos.forEach(x=>{if(x===r||!x.activo)return;const theirs=repCodes(x).map(ncode);
  const decl=(r.eq||[]).some(e=>theirs.indexOf(ncode(e.c))>=0)||(x.eq||[]).some(e=>mine.indexOf(ncode(e.c))>=0);
  if(decl){out.push({r:x,tipo:'decl',txt:'Equivalencia declarada'});return}
  if(x.rubro===r.rubro&&r.rosca&&r.junta&&ncode(r.rosca)===ncode(x.rosca)&&ncode(r.junta)===ncode(x.junta)){
   if(r.alto&&x.alto&&Math.abs(num(r.alto)-num(x.alto))>1)return;
   out.push({r:x,tipo:'dim',txt:'Misma rosca y junta'+(r.alto&&x.alto?' · altura coincide':' · verificar altura')})}});
 return out.sort((a,b)=>(a.tipo==='decl'?0:1)-(b.tipo==='decl'?0:1)||b.r.qty-a.r.qty)}
function codeClash(codes,self){return DB.repuestos.find(x=>x!==self&&x.activo&&repCodes(x).some(c=>codes.some(a=>ncode(a)&&ncode(a)===ncode(c))))}

/* ===== Importar artículos (alta masiva por CSV) ===== */
const ICOLS=['codigo','cod_proveedor','otros_codigos','descripcion','marca','rubro','proveedor','costo','ganancia','stock','alarma','reposicion'];
ACT.repimpl=()=>csvDown('plantilla_articulos.csv',[ICOLS,['WO130','','WO130B','Filtro de aceite','WEGA','FILTRO DE ACEITE','Nombre del proveedor','2500','50','10','3','6']]);
ACT.repimp=()=>{if(!isBoss())return;modal({title:'Importar artículos (CSV)',wide:true,ok:'Revisar e importar',body:
 '<p class="sm mut">Cargá el listado de repuestos de una vez. Columnas: <code>'+ICOLS.join(';')+'</code>. Obligatorias: <b>codigo, descripcion, rubro, proveedor</b>. <code>otros_codigos</code> separados por <code>|</code>. Si el rubro, la marca o el proveedor no existen se crean. Los artículos cuyo código ya existe se omiten (para modificarlos usá la ficha). El stock inicial queda registrado en la trazabilidad.</p>'+
 '<div class="row"><label class="btn s filebtn">📁 Cargar archivo CSV<input type="file" accept=".csv,text/csv,text/plain" hidden id="fi_file" data-chg="fifile"></label><button class="btn s" data-act="repimpl" type="button">⬇ Descargar plantilla</button></div><textarea id="fi_t" style="min-height:150px;margin-top:8px" aria-label="Contenido del CSV"></textarea>',
 onOk:()=>{const rows=parseCSV(val('fi_t'));if(rows.length<2){merr('Pegá el encabezado y al menos una fila.');return false}
  const hd=rows[0].map(x=>norm(x).replace(/[^a-z_]/g,''));const ix=k=>hd.indexOf(k);
  for(const k of ['codigo','descripcion','rubro','proveedor'])if(ix(k)<0){merr('Falta la columna “'+k+'”.');return false}
  const plan=[],bad=[],seen={};
  rows.slice(1).forEach((rw,n)=>{const g=k=>ix(k)<0?'':String(rw[ix(k)]==null?'':rw[ix(k)]).trim();const L='fila '+(n+2);
   const cod=g('codigo'),desc=g('descripcion'),rub=g('rubro').toUpperCase(),pv=g('proveedor');
   if(!cod||!desc||!rub||!pv){bad.push(L+': faltan datos obligatorios');return}
   const cods=g('otros_codigos').split('|').map(x=>x.trim()).filter(Boolean),cp=g('cod_proveedor');
   const all=[cod,cp].concat(cods).filter(Boolean);
   if(codeClash(all,null)){bad.push(L+': el código ya existe ('+cod+')');return}
   for(const c of all){const k=ncode(c);if(seen[k]){bad.push(L+': código repetido en el archivo ('+c+')');return}}
   const nums={};for(const k of ['costo','ganancia','stock','alarma','reposicion']){const v=g(k).replace(',','.');if(v!==''&&!(isFinite(v)&&+v>=0)){bad.push(L+': “'+k+'” no es un número válido');return}nums[k]=v===''?null:+v}
   all.forEach(c=>seen[ncode(c)]=1);plan.push({cod,cp,cods,desc,marca:g('marca').toUpperCase(),rub,pv,nums})});
  if(bad.length){merr('No se importó nada. Corregí estas filas: '+bad.slice(0,8).join(' · ')+(bad.length>8?' …(+'+(bad.length-8)+')':''));return false}
  if(!plan.length){merr('No hay filas para importar.');return false}
  if(plan.length>1500){merr('Máximo 1500 artículos por carga.');return false}
  plan.forEach(p=>{let pr=DB.provs.find(x=>norm(x.n)===norm(p.pv));if(!pr){pr={id:uid('p'),n:p.pv,cuit:'',tel:'',mail:'',activo:true};DB.provs.push(pr)}
   if(DB.rubrosRep.indexOf(p.rub)<0)DB.rubrosRep.push(p.rub);if(p.marca&&DB.marcas.indexOf(p.marca)<0)DB.marcas.push(p.marca);
   const pc=p.nums.costo||0,gan=p.nums.ganancia==null?50:p.nums.ganancia,q=p.nums.stock||0;
   const r={id:uid('r'),cod:p.cod,codProv:p.cp,desc:p.desc,marca:p.marca,rubro:p.rub,provId:pr.id,pc,gan,pv:r2(pc*(1+gan/100)),qty:0,alarma:p.nums.alarma==null?2:p.nums.alarma,repos:p.nums.reposicion||0,venc:false,fvenc:'',pAnt:0,fAct:'',iva:21,rosca:'',junta:'',apl:'',cods:p.cods,oem:'',eq:[],largo:'',ancho:'',alto:'',dext:'',dint:'',valv:'',picos:'',obs:'',fuente:'',fVerif:'',hist:[],activo:true};
   DB.repuestos.push(r);if(q>0)stockMove(r,q,'Saldo inicial (importación)','CSV')});
  audit('Importación de artículos',plan.length+' artículos');save();renderView();toast(plan.length+' artículos importados');return true}})};
ACT.repfexp=()=>csvDown('fichas_tecnicas_'+TODAY()+'.csv',[FCOLS].concat(DB.repuestos.filter(r=>r.activo).map(r=>[r.cod,r.desc,r.largo,r.ancho,r.alto,r.dext,r.dint,r.rosca,r.junta,r.valv,r.picos,r.obs,(r.eq||[]).map(e=>e.m+':'+e.c).join('|'),r.oem,(r.cods||[]).join('|'),String(r.apl||'').split('\n').join('|')])));
function parseCSV(t){t=String(t).replace(/^﻿/,'');const first=t.split(/\r?\n/)[0]||'';const sep=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',';const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"')q=true;else if(ch===sep){row.push(cur);cur=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}else cur+=ch}
 row.push(cur);if(row.some(x=>x.trim()!==''))rows.push(row);return rows}
CHG.fifile=t=>{const f=t.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const a=$('#fi_t');if(a)a.value=String(rd.result)};rd.readAsText(f)};
ACT.repfimp=()=>{if(!isBoss())return;modal({title:'Importar fichas técnicas (equivalencias y dimensiones)',wide:true,ok:'Analizar y aplicar',body:
 '<p class="sm mut">No hay API pública del catálogo para conectar de forma automática <b>[VERIFICAR con WEGA]</b>. Alternativa: copiá los datos de la ficha en un CSV con estas columnas y cargalo acá. Sólo se actualizan las celdas con valor; cada cambio queda en la trazabilidad y el artículo se marca como verificado hoy.</p><p class="sm"><code>'+FCOLS.join(';')+'</code><br><span class="mut">equivalencias: <code>MARCA:CODIGO|MARCA:CODIGO</code> · otros_codigos y aplicacion separados por <code>|</code> · el código identifica al artículo por cualquiera de sus códigos.</span></p>'+
 '<div class="row"><label class="btn s filebtn">📁 Cargar archivo CSV<input type="file" accept=".csv,text/csv,text/plain" hidden id="fi_file" data-chg="fifile"></label><button class="btn s" data-act="repfexp" type="button">⬇ Descargar plantilla con mis datos</button></div><textarea id="fi_t" style="min-height:150px;margin-top:8px" aria-label="Contenido del CSV"></textarea>',
 onOk:()=>{const rows=parseCSV(val('fi_t'));if(rows.length<2){merr('Pegá el encabezado y al menos una fila.');return false}
  const hd=rows[0].map(x=>norm(x).replace(/[^a-z_]/g,''));const ix=k=>hd.indexOf(k);if(ix('codigo')<0){merr('Falta la columna “codigo”.');return false}
  const plan=[],bad=[];
  rows.slice(1).forEach((rw,n)=>{const g=k=>ix(k)<0?'':String(rw[ix(k)]==null?'':rw[ix(k)]).trim();const cd=g('codigo');const r=cd&&DB.repuestos.find(x=>x.activo&&repCodes(x).some(c=>ncode(c)===ncode(cd)));if(!r){bad.push(cd||'(fila '+(n+2)+')');return}
   const ch={};let err='';const set=(k,v)=>{if(v!=='')ch[k]=v};
   [['largo','largo'],['ancho','ancho'],['alto','alto'],['dext','diam_ext'],['dint','diam_int']].forEach(p=>{const v=g(p[1]);if(v){if(!/^\d+([.,]\d+)?$/.test(v))err='dimensión no numérica en '+p[1];else ch[p[0]]=v.replace(',','.')}});
   set('rosca',g('rosca'));set('junta',g('junta'));set('valv',g('valvula'));set('picos',g('picos'));set('obs',g('observaciones'));set('oem',g('oem'));
   const eqs=g('equivalencias');if(eqs){const arr=[];eqs.split('|').forEach(p=>{const i=p.indexOf(':');if(i<1||!p.slice(i+1).trim())err='equivalencias con formato inválido';else arr.push({m:p.slice(0,i).trim().toUpperCase(),c:p.slice(i+1).trim()})});if(!err)ch.eq=arr}
   const oc=g('otros_codigos');if(oc){const arr=oc.split('|').map(x=>x.trim()).filter(Boolean);const own=[r.cod,r.codProv].map(ncode);if(arr.some(c=>own.indexOf(ncode(c))>=0))err='otro código repite el principal';else if(codeClash(arr,r))err='otro código pertenece a otro artículo';else ch.cods=arr}
   const ap=g('aplicacion');if(ap)ch.apl=ap.split('|').map(x=>x.trim()).filter(Boolean).join('\n');
   if(err){bad.push(cd+' ('+err+')');return}plan.push({r,ch})});
  if(!plan.length){merr('Ninguna fila se puede aplicar. Problemas: '+bad.slice(0,6).join(', '));return false}
  if(!confirm('Se actualizarán '+plan.length+' fichas técnicas'+(bad.length?' · no se aplican '+bad.length+' filas: '+bad.slice(0,5).join(', '):'')+'. ¿Aplicar?'))return false;
  let cambios=0;plan.forEach(p=>{cambios+=applyTech(p.r,p.ch,'Importación de catálogo WEGA (CSV)',true)});
  audit('Fichas técnicas importadas',plan.length+' artículos · '+cambios+' campos');save();closeModal();renderView();toast(plan.length+' fichas actualizadas · '+cambios+' campos cambiados'+(bad.length?' · '+bad.length+' sin aplicar':''),bad.length>0);return false}})};

 modal({title:'Pago a '+p.n,wide:true,ok:'Registrar pago',body:'<p>Deuda: <b>'+fmt(deu)+'</b></p><div class="g3"><div class="f"><label for="pp_m">Monto del pago</label><input id="pp_m" inputmode="decimal" value="'+deu+'" data-chg="ppcalc"></div><div class="f"><label for="pp_k">Medio</label><select id="pp_k" data-chg="ppcalc"><option value="ef">Efectivo (de una o varias cajas)</option><option value="tr">Transferencia</option></select></div><div class="f"><label for="pp_r">Referencia / comprobante</label><input id="pp_r" placeholder="Recibo, N° de transferencia…"></div></div><div id="pp_cj"></div><div id="pp_res" class="demoflag" style="background:#eef6ff;border-color:#b9d6f7;color:#12406f"></div>',calc:()=>{ppRows();CHG.ppcalc({id:'x'})},
 onOk:()=>{try{const r=ppCalc();if(r.err)throw new Error(r.err);if(val('pp_r').trim().length<3)throw new Error('Cargá la referencia del pago.');
  const m=r2(num(val('pp_m')));if(val('pp_k')==='ef'){if(!DB.turno.abierto)throw new Error('Abrí el turno de caja.');const lg=ledgerAdd(p.id,'Pago',m,val('pp_r').trim(),r.asig);r.asig.forEach(a=>cajaMov(a.cajaId,'egreso','f4',a.monto,'Pago a '+p.n+' · '+val('pp_r').trim(),{lg:lg.id}))}else ledgerAdd(p.id,'Pago',m,'Transferencia · '+val('pp_r').trim(),[]);
  audit('Pago a proveedor',p.n+' '+fmt(m));save();closeModal();renderView();toast('Pago registrado');return false}catch(e){merr(e.message);return false}}})};
function ppRows(){const el=$('#pp_cj');if(!el)return;el.innerHTML=val('pp_k')==='ef'?'<h3>Reparto entre cajas (efectivo disponible)</h3><div class="g3">'+(DB.turno.abierto?DB.cajas.map(c=>'<div class="f"><label for="pp_c_'+c.id+'">'+h(c.n)+' · disponible '+fmt(cajaEfectivo(c.id))+'</label><input id="pp_c_'+c.id+'" data-chg="ppcalc" inputmode="decimal" placeholder="0,00"></div>').join(''):'<p class="mut">Turno de caja cerrado.</p>')+'</div>':''}
function ppCalc(){const m=r2(num(val('pp_m'))),deu=provDeuda(UI.pp.id);if(!(m>0))return{err:'Ingresá el monto.'};if(m>deu+0.004)return{err:'El pago supera la deuda ('+fmt(deu)+').'};
 if(val('pp_k')!=='ef')return{asig:[],resta:0,ok:true};let s=0;const asig=[];for(const c of DB.cajas){const el=document.getElementById('pp_c_'+c.id);const v=el?r2(num(el.value)):0;if(v<0)return{err:'Importe negativo.'};if(v>0){if(v>cajaEfectivo(c.id)+0.004)return{err:'La '+c.n+' no tiene efectivo suficiente.'};asig.push({cajaId:c.id,monto:v});s+=v}}
 s=r2(s);if(Math.abs(s-m)>0.004)return{err:'El reparto ('+fmt(s)+') debe sumar exactamente '+fmt(m)+' (faltan '+fmt(m-s)+').',asig,soft:true};return{asig,ok:true}}
CHG.ppcalc=t=>{if(t.id==='pp_k')ppRows();if(!$('#pp_res'))return;const r=ppCalc();$('#pp_res').innerHTML=r.err?'⚠ '+h(r.err):'✔ Todo en orden: el pago se registra de una sola vez (todo o nada).'};
ACT.pnc=d=>{const p=provOf(d.id);modal({title:'Nota de crédito de '+p.n,ok:'Registrar NC',body:'<div class="g2"><div class="f"><label for="nc_m">Monto</label><input id="nc_m" inputmode="decimal"></div><div class="f"><label for="nc_r">Motivo / N° de NC</label><input id="nc_r"></div></div>',onOk:()=>{const m=r2(num(val('nc_m')));if(!(m>0)){merr('Monto inválido.');return false}if(m>provDeuda(p.id)+0.004){merr('La NC supera la deuda.');return false}if(val('nc_r').trim().length<3){merr('Indicá el motivo o N° de NC.');return false}ledgerAdd(p.id,'NC',m,val('nc_r').trim());audit('NC de proveedor',p.n+' '+fmt(m));save();renderView();return true}})};

/* ===== Caja ===== */
V.caja=()=>{const T=DB.turno;let b='';
 if(!T.abierto){b='<div class="card"><h3>Turno de caja cerrado</h3><p class="mut">Abrí el turno con el efectivo inicial de cada caja para poder cobrar en efectivo y pagar proveedores.</p><div class="g3">'+DB.cajas.map(c=>'<div class="f"><label for="ap_'+c.id+'">Apertura · '+h(c.n)+'</label><input id="ap_'+c.id+'" inputmode="decimal" value="0"></div>').join('')+'</div><button class="btn p" data-act="cajaabrir">Abrir turno</button></div>'}
 else{const ms=DB.movs.filter(m=>m.turnoId===T.id).sort((a,b)=>b.t-a.t);
  b='<div class="g3" style="margin-bottom:12px">'+DB.cajas.map(c=>'<div class="kpi" style="cursor:default"><div class="l">'+h(c.n)+(c.principal?' · principal':'')+'</div><div class="v">'+fmt(cajaEfectivo(c.id))+'</div><div class="sm mut">Apertura '+fmt(T.apert[c.id]||0)+'</div></div>').join('')+'</div>'+
  '<div class="row" style="margin-bottom:10px"><button class="btn p" data-act="cajamov" data-t="ingreso">➕ Ingreso</button><button class="btn" data-act="cajamov" data-t="egreso">➖ Egreso</button><button class="btn" data-act="cajatras">⇄ Traspaso entre cajas</button><span class="sp"></span><button class="btn d" data-act="cajacierre">Arqueo y cierre de turno</button></div>'+
  '<div class="chips" style="margin-bottom:8px">'+[['mov','Movimientos del turno'],['ne','Cobros de hoy por medio'],['hist','Turnos cerrados']].map(t=>'<button class="chip'+(UI.cajaTab===t[0]?' on':'')+'" data-act="cajatab" data-t="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>'+cajaTabBody(ms)}
 if(!T.abierto)b+='<h3>Turnos cerrados</h3>'+cajaHist();
 return '<div class="bar"><h2>Caja</h2><span class="badge '+(T.abierto?'ok':'warn')+'">'+(T.abierto?'Turno abierto · '+fdate(T.fecha)+' · '+h(T.por):'Cerrado')+'</span></div>'+b};
function cajaTabBody(ms){if(UI.cajaTab==='hist')return cajaHist();
 if(UI.cajaTab==='ne'){const by={};DB.ots.forEach(o=>o.pagos.forEach(p=>{if(p.fecha===TODAY())by[p.medio]=(by[p.medio]||0)+p.monto}));const k=Object.keys(by);return '<div class="tw"><table><thead><tr><th>Medio</th><th class="n">Cobrado hoy</th></tr></thead><tbody>'+(k.length?k.map(x=>'<tr><td>'+x+'</td><td class="n">'+fmt(by[x])+'</td></tr>').join(''):'<tr><td colspan="2" class="mut c">Sin cobros hoy.</td></tr>')+'</tbody></table></div><p class="sm mut">Transferencias y tarjetas no pasan por el efectivo de caja; la cuenta corriente es deuda del cliente.</p>'}
 return '<div class="tw"><table><thead><tr><th>Hora</th><th>Caja</th><th>Tipo</th><th>Rubro</th><th>Detalle</th><th>Usuario</th><th class="n">Importe</th></tr></thead><tbody>'+(ms.length?ms.map(m=>'<tr><td>'+new Date(m.t).toTimeString().slice(0,5)+'</td><td>'+h((DB.cajas.find(c=>c.id===m.cajaId)||{}).n)+'</td><td>'+(m.tr?'Traspaso':m.tipo)+'</td><td>'+h((rubFin(m.conc)||{}).n)+'</td><td>'+h(m.ref)+'</td><td>'+h(m.u)+'</td><td class="n" style="color:'+(m.tipo==='ingreso'?'var(--ok)':'var(--bad)')+'">'+(m.tipo==='ingreso'?'+':'−')+fmt(m.monto)+'</td></tr>').join(''):'<tr><td colspan="7" class="mut c">Sin movimientos en este turno.</td></tr>')+'</tbody></table></div>'}
function cajaHist(){return DB.hist.length?'<div class="tw"><table><thead><tr><th>Turno</th><th>Fecha</th><th>Cerró</th><th>Arqueo por caja</th><th>Motivo de diferencia</th></tr></thead><tbody>'+DB.hist.slice().reverse().map(x=>'<tr><td>'+h(x.id)+'</td><td>'+fdate(x.fecha)+'</td><td>'+h(x.por)+'</td><td>'+x.cierres.map(c=>h(c.n)+': esperado '+fmt(c.esp)+' · contado '+fmt(c.cont)+' · <b style="color:'+(Math.abs(c.dif)>0.004?'var(--bad)':'var(--ok)')+'">dif. '+fmt(c.dif)+'</b>').join('<br>')+'</td><td>'+h(x.motivo||'—')+'</td></tr>').join('')+'</tbody></table></div>':'<p class="mut">Todavía no hay turnos cerrados.</p>'}
ACT.cajatab=d=>{UI.cajaTab=d.t;renderView()};
ACT.cajaabrir=()=>{const ap={};for(const c of DB.cajas){const v=r2(num(val('ap_'+c.id)));if(v<0){toast('Apertura negativa.',1);return}ap[c.id]=v}DB.seq.tc++;DB.turno={abierto:true,id:'T'+DB.seq.tc,fecha:TODAY(),apert:ap,por:ME.n};audit('Turno de caja abierto',DB.turno.id);save();renderView();toast('Turno abierto')};
ACT.cajamov=d=>{const ing=d.t==='ingreso';modal({title:ing?'Ingreso manual de efectivo':'Egreso de efectivo',ok:'Registrar',body:'<div class="g2"><div class="f"><label for="cm_c">Caja</label><select id="cm_c">'+opts(DB.cajas,'C1',c=>[c.id,c.n+' · '+fmt(cajaEfectivo(c.id))])+'</select></div><div class="f"><label for="cm_r">Rubro financiero (obligatorio)</label><select id="cm_r">'+opts(DB.rubrosFin.filter(r=>r.t===(ing?'ing':'egr')),'',r=>[r.id,r.n],'— elegir rubro —')+'</select></div><div class="f"><label for="cm_m">Monto</label><input id="cm_m" inputmode="decimal"></div><div class="f"><label for="cm_d">Detalle</label><input id="cm_d" placeholder="Qué es y a quién"></div></div>',
 onOk:()=>{const m=r2(num(val('cm_m')));if(!val('cm_r')){merr('Elegí el rubro financiero.');return false}if(!(m>0)){merr('Monto inválido.');return false}if(val('cm_d').trim().length<3){merr('Escribí el detalle.');return false}if(!ing&&m>cajaEfectivo(val('cm_c'))+0.004){merr('La caja no tiene efectivo suficiente.');return false}
  cajaMov(val('cm_c'),d.t,val('cm_r'),m,val('cm_d').trim());audit('Caja '+d.t,fmt(m)+' · '+val('cm_d').trim());save();renderView();return true}})};
ACT.cajatras=()=>{modal({title:'Traspaso entre cajas',ok:'Traspasar',body:'<div class="g2"><div class="f"><label for="tr_o">Desde</label><select id="tr_o">'+opts(DB.cajas,'C1',c=>[c.id,c.n+' · '+fmt(cajaEfectivo(c.id))])+'</select></div><div class="f"><label for="tr_d">Hacia</label><select id="tr_d">'+opts(DB.cajas,'C2',c=>[c.id,c.n])+'</select></div><div class="f"><label for="tr_m">Monto</label><input id="tr_m" inputmode="decimal"></div><div class="f"><label for="tr_r">Rubro'+(DB.cfg.traspasoSinRubro?' (opcional: usa “Traspaso interno”)':' (obligatorio)')+'</label><select id="tr_r">'+opts(DB.rubrosFin.filter(r=>!r.oculto),'',r=>[r.id,r.n],DB.cfg.traspasoSinRubro?'Traspaso interno':'— elegir rubro —')+'</select></div><div class="f"><label for="tr_c">Comprobante N°</label><input id="tr_c"></div><div class="f"><label for="tr_a">Autoriza</label><select id="tr_a">'+opts(DB.users.filter(u=>u.rol==='dueno'||u.rol==='jefe'),'',u=>[u.n,u.n],'— elegir —')+'</select></div></div>',
 onOk:()=>{const o=val('tr_o'),dd=val('tr_d'),m=r2(num(val('tr_m')));if(o===dd){merr('Origen y destino deben ser distintos.');return false}if(!(m>0)){merr('Monto inválido.');return false}if(m>cajaEfectivo(o)+0.004){merr('La caja de origen no tiene efectivo suficiente.');return false}
  let rub=val('tr_r');if(!rub){if(DB.cfg.traspasoSinRubro)rub='sys';else{merr('Elegí el rubro financiero.');return false}}if(val('tr_c').trim().length<2){merr('Cargá el N° de comprobante.');return false}if(!val('tr_a')){merr('Indicá quién autoriza.');return false}
  const tid=uid('tr'),ref='Traspaso '+(DB.cajas.find(c=>c.id===o)||{}).n+' → '+(DB.cajas.find(c=>c.id===dd)||{}).n+' · comp. '+val('tr_c').trim()+' · autoriza '+val('tr_a');cajaMov(o,'egreso',rub,m,ref,{tr:tid});cajaMov(dd,'ingreso',rub,m,ref,{tr:tid});audit('Traspaso entre cajas',fmt(m)+' · '+val('tr_c').trim());save();renderView();return true}})};
ACT.cajacierre=()=>{modal({title:'Arqueo y cierre del turno',ok:'Cerrar turno',wide:true,body:'<p class="sm mut">Contá el efectivo de cada caja. Si hay diferencia, el motivo es obligatorio.</p><div class="tw"><table class="itbl"><thead><tr><th>Caja</th><th class="n">Esperado</th><th>Contado</th><th class="n">Diferencia</th></tr></thead><tbody>'+DB.cajas.map(c=>'<tr><td>'+h(c.n)+'</td><td class="n">'+fmt(cajaEfectivo(c.id))+'</td><td><input id="ar_'+c.id+'" data-chg="arcalc" inputmode="decimal" placeholder="0,00"></td><td class="n" id="ard_'+c.id+'">—</td></tr>').join('')+'</tbody></table></div><div class="f" style="margin-top:10px"><label for="ar_m">Motivo de la diferencia (si corresponde)</label><input id="ar_m"></div>',
 onOk:()=>{const ci=[];let dif=false;for(const c of DB.cajas){const raw=val('ar_'+c.id).trim();if(raw===''){merr('Contá el efectivo de '+c.n+'.');return false}const cont=r2(num(raw)),esp=cajaEfectivo(c.id),d=r2(cont-esp);if(cont<0){merr('Importe negativo.');return false}if(Math.abs(d)>0.004)dif=true;ci.push({cajaId:c.id,n:c.n,esp,cont,dif:d})}
  if(dif&&val('ar_m').trim().length<4){merr('Hay diferencias: indicá el motivo.');return false}DB.hist.push({id:DB.turno.id,fecha:DB.turno.fecha,por:ME.n,cierres:ci,motivo:val('ar_m').trim()});DB.turno={abierto:false,id:DB.turno.id,fecha:DB.turno.fecha,apert:{},por:''};audit('Turno de caja cerrado',DB.hist[DB.hist.length-1].id);save();closeModal();renderView();toast('Turno cerrado');return false}})};
CHG.arcalc=t=>{const id=t.id.slice(3);const esp=cajaEfectivo(id),e=document.getElementById('ard_'+id);if(t.value.trim()===''){e.textContent='—';return}const d=r2(num(t.value)-esp);e.innerHTML='<b style="color:'+(Math.abs(d)>0.004?'var(--bad)':'var(--ok)')+'">'+fmt(d)+'</b>'};

V.equipo=()=>{const cats=[...new Set(DB.equip.map(e=>e.cat))];const l=DB.equip.filter(e=>!UI.eqCat||e.cat===UI.eqCat);const ok=DB.equip.filter(e=>e.est==='ok').length,pct=DB.equip.length?Math.round(ok/DB.equip.length*100):0;const ed=isBoss();
 return '<div class="bar"><h2>Equipamiento y habilitación del taller</h2><span class="sp"></span>'+(ed?'<button class="btn s" data-act="eqcsv">Lista de faltantes (Excel)</button>':'')+'</div>'+
 '<div class="card"><div class="row"><b>Taller listo: '+pct+' %</b><span class="mut sm">'+ok+' de '+DB.equip.length+' ítems disponibles · '+DB.equip.filter(e=>e.est==='falta').length+' faltan · '+DB.equip.filter(e=>e.est==='mant').length+' en mantenimiento'+(DB.equip.some(e=>e.est==='sinrel')?' · '+DB.equip.filter(e=>e.est==='sinrel').length+' sin relevar':'')+'</span></div><div class="pbar" style="margin-top:6px" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pct+'%"></i></div></div>'+
 '<div class="chips" style="margin-bottom:10px"><button class="chip'+(!UI.eqCat?' on':'')+'" data-act="eqcat" data-c="">Todo</button>'+cats.map(c=>'<button class="chip'+(UI.eqCat===c?' on':'')+'" data-act="eqcat" data-c="'+h(c)+'">'+h(c)+'</button>').join('')+'</div>'+
 '<div class="tw"><table class="itbl"><thead><tr><th>Ítem</th><th>Estado</th><th>Cant.</th><th>Próx. calibración / service</th><th>Nota</th></tr></thead><tbody>'+l.map(e=>'<tr><td><span class="mut sm">'+h(e.cat)+'</span><br>'+h(e.n)+'</td><td><select data-chg="eqf" data-id="'+e.id+'" data-f="est" aria-label="Estado"'+(ed?'':' disabled')+'><option value="ok"'+(e.est==='ok'?' selected':'')+'>Disponible</option><option value="falta"'+(e.est==='falta'?' selected':'')+'>Falta</option><option value="mant"'+(e.est==='mant'?' selected':'')+'>En mantenimiento</option><option value="sinrel"'+(e.est==='sinrel'?' selected':'')+'>Sin relevar</option></select></td><td><input style="width:70px" data-chg="eqf" data-id="'+e.id+'" data-f="cant" value="'+e.cant+'" inputmode="numeric"'+(ed?'':' disabled')+' aria-label="Cantidad"></td><td><input type="date" data-chg="eqf" data-id="'+e.id+'" data-f="prox" value="'+h(e.prox)+'"'+(ed?'':' disabled')+' aria-label="Próxima calibración">'+(e.prox&&daysTo(e.prox)<=30?' <span class="badge '+(daysTo(e.prox)<0?'bad':'warn')+'">'+(daysTo(e.prox)<0?'vencido':'en '+daysTo(e.prox)+' d')+'</span>':'')+'</td><td><input data-chg="eqf" data-id="'+e.id+'" data-f="nota" value="'+h(e.nota)+'"'+(ed?'':' disabled')+' aria-label="Nota"></td></tr>').join('')+'</tbody></table></div>'};
ACT.eqcat=d=>{UI.eqCat=d.c;renderView()};
CHG.eqf=t=>{const e=DB.equip.find(x=>x.id===t.dataset.id);if(!e||!isBoss())return;const f=t.dataset.f;e[f]=f==='cant'?(parseInt(t.value)||0):t.value;audit('Equipamiento',e.n+' · '+f+' = '+t.value);save();if(f==='est')renderView()};
ACT.eqcsv=()=>csvDown('equipamiento_faltante.csv',[['Categoría','Ítem','Estado','Cantidad requerida']].concat(DB.equip.filter(e=>e.est!=='ok').map(e=>[e.cat,e.n,e.est==='falta'?'Falta':e.est==='sinrel'?'Sin relevar':'En mantenimiento',e.cant])));

V.seguridad=()=>{const t=UI.segTab;let b='';const ed=isBoss()||ME.rol==='mecanico';
 if(t==='epp')b='<div class="tw"><table><thead><tr><th>Elemento de protección personal</th><th class="n">Stock</th><th class="n">Mínimo</th><th></th></tr></thead><tbody>'+DB.epp.map(e=>'<tr><td>'+h(e.n)+(e.stock<e.min?' <span class="badge warn">bajo mínimo</span>':'')+'</td><td class="n">'+e.stock+'</td><td class="n">'+e.min+'</td><td><div class="row"><button class="btn s" data-act="eppent" data-id="'+e.id+'">Entregar a personal</button>'+(isBoss()?'<button class="btn s" data-act="eppadd" data-id="'+e.id+'">+ Ingreso</button>':'')+'</div></td></tr>').join('')+'</tbody></table></div><h3 style="margin-top:12px">Entregas registradas</h3>'+(DB.entregas.length?'<div class="tw"><table><tbody>'+DB.entregas.slice(0,15).map(x=>'<tr><td>'+fdate(x.fecha)+'</td><td>'+h(x.pers)+'</td><td>'+h(x.n)+' × '+x.cant+'</td></tr>').join('')+'</tbody></table></div>':'<p class="mut">Sin entregas.</p>');
 else if(t==='ext')b='<div class="tw"><table><thead><tr><th>Ubicación</th><th>Tipo</th><th>Vencimiento de carga</th><th></th></tr></thead><tbody>'+DB.extint.map(x=>{const d=daysTo(x.venc);return '<tr><td>'+h(x.ubic)+'</td><td>'+h(x.tipo)+'</td><td>'+fdate(x.venc)+' <span class="badge '+(d<0?'bad':d<=30?'warn':'ok')+'">'+(d<0?'vencido':d<=30?'en '+d+' d':'vigente')+'</span></td><td>'+(isBoss()?'<button class="btn s" data-act="extrec" data-id="'+x.id+'">Registrar recarga</button>':'')+'</td></tr>'}).join('')+'</tbody></table></div><p class="sm mut">Plazos de recarga y señalética exigida: [VERIFICAR] con el prestador habilitado y la normativa vigente.</p>'+(isBoss()?'<button class="btn s" data-act="extnew">➕ Agregar extintor</button>':'');
 else if(t==='res'){const tipos=['Aceite usado','Baterías','Filtros usados','Líquido refrigerante','Sólidos contaminados'];b='<div class="g4" style="margin-bottom:10px">'+tipos.map(x=>'<div class="kpi" style="cursor:default"><div class="v">'+resStock(x)+' <span class="sm">'+((DB.resid.find(r=>r.tipo===x)||{unidad:x==='Baterías'||x==='Filtros usados'?'u':x==='Sólidos contaminados'?'kg':'L'}).unidad)+'</span></div><div class="l">'+x+' acumulado</div></div>').join('')+'</div>'+(isBoss()?'<div class="row" style="margin-bottom:8px"><button class="btn s" data-act="resgen">➕ Registrar generación</button><button class="btn s p" data-act="resret">🚛 Registrar retiro del gestor</button></div>':'')+'<div class="tw"><table><thead><tr><th>Fecha</th><th>Tipo</th><th class="n">Cantidad</th><th>Referencia</th></tr></thead><tbody>'+DB.resid.slice().sort((a,b)=>a.fecha<b.fecha?1:-1).slice(0,30).map(r=>'<tr><td>'+fdate(r.fecha)+'</td><td>'+h(r.tipo)+'</td><td class="n" style="color:'+(r.cant<0?'var(--ok)':'inherit')+'">'+(r.cant>0?'+':'')+r.cant+' '+r.unidad+'</td><td>'+h(r.ref)+'</td></tr>').join('')+'</tbody></table></div><p class="sm mut">La generación se carga sola al entregar una OT con aceite, filtros o baterías. Requisitos de gestión de residuos peligrosos: [VERIFICAR] con la autoridad ambiental.</p>'}
 else b='<div class="tw"><table><thead><tr><th>Habilitación / seguro</th><th>Ente</th><th>Vencimiento</th><th></th></tr></thead><tbody>'+DB.habil.map(x=>{const d=daysTo(x.venc);return '<tr><td>'+h(x.n)+'</td><td>'+h(x.ent)+'</td><td>'+fdate(x.venc)+(x.venc?' <span class="badge '+(d<0?'bad':d<=30?'warn':'ok')+'">'+(d<0?'vencida':d<=30?'en '+d+' d':'vigente')+'</span>':'')+'</td><td>'+(isBoss()?'<button class="btn s" data-act="habren" data-id="'+x.id+'">Renovar</button>':'')+'</td></tr>'}).join('')+'</tbody></table></div><p class="sm mut">Requisitos y plazos: [VERIFICAR] con el municipio, la ART y la aseguradora. '+(MODO==='practica'?'Los datos cargados son de ejemplo.':'Cargá las habilitaciones y seguros reales del taller.')+'</p>'+(isBoss()?'<button class="btn s" data-act="habnew">➕ Agregar</button>':'');
 return '<div class="bar"><h2>Seguridad y medio ambiente</h2></div><div class="chips" style="margin-bottom:10px">'+[['epp','EPP'],['ext','Extintores'],['res','Residuos peligrosos'],['hab','Habilitaciones y seguros']].map(x=>'<button class="chip'+(t===x[0]?' on':'')+'" data-act="segtab" data-t="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>'+b};

ACT.eppent=d=>{const e=DB.epp.find(x=>x.id===d.id);modal({title:'Entregar: '+e.n,ok:'Registrar entrega',body:'<div class="g2"><div class="f"><label for="ee_p">Personal</label><select id="ee_p">'+opts(DB.users.filter(u=>u.rol!=='dueno'),'',u=>[u.n,u.n],'— elegir —')+'</select></div><div class="f"><label for="ee_c">Cantidad</label><input id="ee_c" type="number" min="1" value="1"></div></div><p class="mut sm">Stock disponible: '+e.stock+'</p>',onOk:()=>{const c=parseInt(val('ee_c'));if(!val('ee_p')){merr('Elegí a quién se entrega.');return false}if(!(c>0)||c>e.stock){merr('Cantidad inválida o mayor al stock.');return false}e.stock-=c;DB.entregas.unshift({fecha:TODAY(),pers:val('ee_p'),n:e.n,cant:c});audit('Entrega de EPP',e.n+' × '+c+' a '+val('ee_p'));save();renderView();return true}})};

function resForm(k){const tipos=['Aceite usado','Baterías','Filtros usados','Líquido refrigerante','Sólidos contaminados'];modal({title:k==='gen'?'Registrar generación de residuo':'Retiro por gestor autorizado',ok:'Registrar',body:'<div class="g2"><div class="f"><label for="rs_t">Tipo</label><select id="rs_t">'+opts(tipos,'',x=>[x,x])+'</select></div><div class="f"><label for="rs_c">Cantidad</label><input id="rs_c" inputmode="decimal"></div>'+(k==='ret'?'<div class="f"><label for="rs_g">Gestor</label><input id="rs_g" placeholder="Razón social del gestor"></div><div class="f"><label for="rs_n">N° de certificado / manifiesto</label><input id="rs_n"></div>':'<div class="f"><label for="rs_n">Referencia</label><input id="rs_n" placeholder="Origen del residuo"></div>')+'</div>',
 onOk:()=>{const t=val('rs_t'),c=num(val('rs_c'));if(!(c>0)){merr('Cantidad inválida.');return false}const u=t==='Baterías'||t==='Filtros usados'?'u':t==='Sólidos contaminados'?'kg':'L';if(k==='ret'){if(c>resStock(t)+0.0001){merr('No podés retirar más de lo acumulado ('+resStock(t)+' '+u+').');return false}if(val('rs_g').trim().length<3||val('rs_n').trim().length<3){merr('Cargá gestor y N° de certificado.');return false}}
  DB.resid.push({id:uid('z'),fecha:TODAY(),tipo:t,cant:k==='ret'?-c:c,unidad:u,ref:k==='ret'?'Retiro '+val('rs_g').trim()+' · cert. '+val('rs_n').trim():(val('rs_n').trim()||'Carga manual')});audit('Residuos',(k==='ret'?'Retiro ':'Generación ')+t+' '+c);save();renderView();return true}})}
ACT.habren=d=>{const x=DB.habil.find(y=>y.id===d.id);modal({title:'Renovar: '+x.n,ok:'Guardar',body:'<div class="f"><label for="hr_f">Nuevo vencimiento</label><input type="date" id="hr_f" value="'+addDays(365)+'"></div>',onOk:()=>{if(!val('hr_f')||val('hr_f')<=TODAY()){merr('La fecha debe ser posterior a hoy.');return false}x.venc=val('hr_f');audit('Renovación',x.n);save();renderView();return true}})};

V.personal=()=>{const ini=TODAY().slice(0,8)+'01';return '<div class="bar"><h2>Personal</h2><span class="sp"></span>'+(ME.rol==='dueno'?'<button class="btn p" data-act="peredit" data-id="">➕ Agregar persona</button>':'')+'</div><div class="tw"><table><thead><tr><th>Nombre</th><th>Rol (el dueño lo asigna)</th><th>Acceso</th><th>Especialidad</th><th class="n">% comisión MO</th><th class="n">OT activas</th><th class="n">OT entregadas (mes)</th><th class="n">Comisión estimada (mes)</th></tr></thead><tbody>'+DB.users.map(u=>{const a=DB.ots.filter(o=>o.mecId===u.id&&o.estado!=='Entregado').length,e=DB.ots.filter(o=>o.mecId===u.id&&o.estado==='Entregado'&&o.entregada>=ini);const mo=e.reduce((s,o)=>s+otTotal(o).mo,0);return '<tr'+(ME.rol==='dueno'?' class="clk" data-act="peredit" data-id="'+u.id+'"':'')+'><td><b>'+h(u.n)+'</b></td><td>'+(ME.rol==='dueno'?'<select data-chg="perrol" data-id="'+u.id+'" aria-label="Rol de '+h(u.n)+'"'+(u.id===ME.id?' disabled title="No podés cambiar tu propio rol"':'')+'>'+opts(Object.keys(ROL),u.rol,k=>[k,ROL[k]])+'</select>':ROL[u.rol])+'</td><td>'+(ME.rol==='dueno'&&u.id!==ME.id?'<button class="btn s'+(u.activo===false?'':' d')+'" data-act="peract" data-id="'+u.id+'">'+(u.activo===false?'Activar':'Desactivar')+'</button>':(u.activo===false?'Inactivo':'Activo'))+'</td><td>'+h(u.esp)+'</td><td class="n">'+u.com+'%</td><td class="n">'+a+'</td><td class="n">'+e.length+'</td><td class="n">'+(u.com?fmt(mo*u.com/100):'—')+'</td></tr>'}).join('')+'</tbody></table></div><p class="sm mut">La comisión estimada se calcula sobre la mano de obra neta de las OT entregadas en el mes.</p>'};
CHG.perrol=t=>{if(ME.rol!=='dueno')return;const u=userOf(t.dataset.id);if(!u||u.id===ME.id){renderView();return}const nr=t.value;
 if(!ROL[nr])return;if(u.rol==='dueno'&&nr!=='dueno'&&DB.users.filter(x=>x.rol==='dueno'&&x.activo!==false).length<2){toast('Debe quedar al menos un dueño activo.',1);renderView();return}
 if(MODO==='real'&&!u.pin&&nr!=='limpieza'){toast('Primero cargale una clave en “Editar” para que pueda ingresar con ese rol.',1);renderView();return}
 const ant=u.rol;u.rol=nr;audit('Rol asignado',u.n+': '+ROL[ant]+' → '+ROL[nr]);save();renderView();toast(u.n+' ahora es '+ROL[nr])};

 if(u.activo!==false&&u.rol==='dueno'&&DB.users.filter(x=>x.rol==='dueno'&&x.activo!==false).length<2){toast('Debe quedar al menos un dueño activo.',1);return}
 u.activo=u.activo===false;audit(u.activo?'Persona activada':'Persona desactivada',u.n);save();renderView()};
ACT.peredit=d=>{const u=d.id?userOf(d.id):{n:'',rol:'mecanico',esp:'',com:0};modal({title:d.id?'Editar persona':'Nueva persona',ok:'Guardar',body:'<div class="g2"><div class="f"><label for="pe_n">Nombre</label><input id="pe_n" value="'+h(u.n)+'"></div><div class="f"><label for="pe_r">Rol</label><select id="pe_r">'+opts(Object.keys(ROL),u.rol,k=>[k,ROL[k]])+'</select></div><div class="f"><label for="pe_e">Especialidad / puesto</label><input id="pe_e" value="'+h(u.esp)+'"></div><div class="f"><label for="pe_c">% comisión sobre mano de obra</label><input id="pe_c" inputmode="decimal" value="'+u.com+'"></div>'+(MODO==='real'?'<div class="f"><label for="pe_pin">'+(u.pin?'Nueva clave (vacío = no cambiar)':'Clave inicial (4 a 8 números)')+'</label><input id="pe_pin" type="password" inputmode="numeric" autocomplete="new-password"></div>':'')+'</div>',
 onOk:async()=>{const c=num(val('pe_c'));const npin=val('pe_pin');if(MODO==='real'){if(npin&&!pinOk(npin)){merr('La clave debe tener de 4 a 8 números.');return false}if(!u.pin&&!npin&&val('pe_r')!=='limpieza'){merr('Cargá una clave inicial para que pueda ingresar.');return false}}if(val('pe_n').trim().length<3){merr('Cargá el nombre.');return false}if(c<0||c>50){merr('La comisión debe estar entre 0 y 50 %.');return false}if(d.id&&u.rol==='dueno'&&val('pe_r')!=='dueno'&&DB.users.filter(x=>x.rol==='dueno').length<2){merr('Debe haber al menos un dueño.');return false}
  const x=d.id?u:{id:uid('u')};Object.assign(x,{n:val('pe_n').trim(),rol:val('pe_r'),esp:val('pe_e').trim(),com:c});if(!d.id)DB.users.push(x);if(npin)await setPin(x,npin);audit('Personal '+(d.id?'editado':'nuevo'),x.n);save();renderView();return true}})};

function repRange(){const t=TODAY();return UI.repoPer==='hoy'?[t,t]:UI.repoPer==='sem'?[addDays(-6),t]:UI.repoPer==='mes'?[t.slice(0,8)+'01',t]:['0000-00-00','9999-99-99']}
V.reportes=()=>{const [a,b]=repRange();const os=DB.ots.filter(o=>o.estado==='Entregado'&&o.entregada>=a&&o.entregada<=b);let neto=0,iva=0,costo=0,rep=0,mo=0;const mec={},rub={};
 os.forEach(o=>{const t=otTotal(o);neto+=t.neto;iva+=t.iva;costo+=t.costo;rep+=t.rep;mo+=t.mo;const k=(userOf(o.mecId)||{n:'Sin asignar'}).n;mec[k]=(mec[k]||0)+t.mo;o.items.forEach(i=>{if(i.k==='rep'){const r=repOf(i.repId),k2=r?r.rubro:'Otros';const x=rub[k2]=rub[k2]||{v:0,c:0};x.v+=i.qty*i.pu;x.c+=i.qty*(i.costo||0)}})});
 const med={};DB.ots.forEach(o=>o.pagos.forEach(p=>{if(p.fecha>=a&&p.fecha<=b)med[p.medio]=(med[p.medio]||0)+p.monto}));const mx=Math.max(1,...Object.values(mec),...Object.values(rub).map(x=>x.v));
 const bars=(o,f)=>Object.keys(o).length?Object.keys(o).sort((x,y)=>f(o[y])-f(o[x])).map(k=>'<div style="margin:6px 0"><div class="row sm"><span class="sp">'+h(k)+'</span><b>'+fmt(f(o[k]))+'</b></div><div class="hbar" style="width:'+Math.max(1,f(o[k])/mx*100)+'%"></div></div>').join(''):'<p class="mut">Sin datos.</p>';
 return '<div class="bar"><h2>Reportes</h2><div class="chips">'+[['hoy','Hoy'],['sem','7 días'],['mes','Este mes'],['todo','Todo']].map(x=>'<button class="chip'+(UI.repoPer===x[0]?' on':'')+'" data-act="repoper" data-p="'+x[0]+'">'+x[1]+'</button>').join('')+'</div><span class="sp"></span><button class="btn s" data-act="repocsv">Exportar OT (Excel)</button></div>'+
 '<div class="g4" style="margin-bottom:12px"><div class="kpi" style="cursor:default"><div class="v">'+os.length+'</div><div class="l">OT entregadas</div></div><div class="kpi" style="cursor:default"><div class="v">'+fmt(neto+iva)+'</div><div class="l">Facturación total (c/IVA)</div></div><div class="kpi okk" style="cursor:default"><div class="v">'+fmt(neto-costo)+'</div><div class="l">Margen bruto (neto − costo repuestos)</div></div><div class="kpi" style="cursor:default"><div class="v">'+fmt(os.length?(neto+iva)/os.length:0)+'</div><div class="l">Ticket promedio</div></div></div>'+
 '<div class="g2"><div class="card"><h3>Mano de obra por mecánico (neto)</h3>'+bars(mec,x=>x)+'</div><div class="card"><h3>Venta de repuestos por rubro (neto)</h3>'+bars(rub,x=>x.v)+'</div></div>'+
 '<div class="g2"><div class="card"><h3>Composición</h3><p>Repuestos: <b>'+fmt(rep)+'</b> · Mano de obra: <b>'+fmt(mo)+'</b> · IVA: <b>'+fmt(iva)+'</b></p><p class="sm">Ventas de mostrador en el período (aparte): <b>'+fmt((DB.ventas||[]).filter(v=>v.fecha>=a&&v.fecha<=b).reduce((s,v)=>s+v.total,0))+'</b></p><p class="sm mut">Costo de repuestos vendidos: '+fmt(costo)+'</p></div><div class="card"><h3>Cobros del período por medio</h3>'+(Object.keys(med).length?Object.keys(med).map(k=>'<div class="row"><span class="sp">'+k+'</span><b>'+fmt(med[k])+'</b></div>').join(''):'<p class="mut">Sin cobros.</p>')+'</div></div>'+
 '<div class="card"><h3>Posición actual</h3><div class="g3"><div>Deuda de clientes<br><b>'+fmt(DB.clientes.reduce((s,c)=>s+c.saldo,0))+'</b></div><div>Deuda con proveedores<br><b>'+fmt(DB.provs.reduce((s,p)=>s+provDeuda(p.id),0))+'</b></div><div>Stock valorizado a costo<br><b>'+fmt(DB.repuestos.filter(r=>r.activo).reduce((s,r)=>s+r.qty*r.pc,0))+'</b></div></div></div>'};

  Object.assign(UI.vt,{lines:[],cli:'',cond:'CF',doc:'',nc:{prov:'Salta',lim:0}});save();renderView();toast('Venta '+ref+' cobrada: '+fmt(t.total))}catch(e){toast(e.message,1)}};

function lev1(a,b){if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,d=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue}if(++d>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}}return d+(a.length-i)+(b.length-j)<=1}

async function unzipAll(buf){const u=new Uint8Array(buf),dv=new DataView(buf);let e=-1;for(let i=u.length-22;i>=Math.max(0,u.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}

/* ---------- respaldo cifrado (AES-256-GCM, clave derivada con PBKDF2) ---------- */
async function vbKey(pass,salt,it){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}

 const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await vbKey(pass,salt,it),new TextEncoder().encode(txt));return JSON.stringify({fmt:'vb-respaldo-cifrado',v:1,alg:'AES-256-GCM',kdf:'PBKDF2-SHA256',it,salt:b64e(salt),iv:b64e(iv),data:b64e(new Uint8Array(ct))})}
async function descifrar(o,pass){try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(o.iv)},await vbKey(pass,b64d(o.salt),o.it||310000),b64d(o.data));return new TextDecoder().decode(pt)}catch(e){throw new Error('Clave incorrecta o archivo dañado.')}}

/* ---------- copias automáticas locales (IndexedDB, aparte del almacenamiento principal) ---------- */
const SNAPDB='vb_copias';
function snapOpen(){return new Promise((ok,ko)=>{if(!window.indexedDB)return ko(new Error('sin IndexedDB'));const r=indexedDB.open(SNAPDB,1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('snap')){const s=d.createObjectStore('snap',{keyPath:'id'});s.createIndex('ls','ls')}};r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)})}
async function snapList(){try{const d=await snapOpen();return await new Promise(ok=>{const q=d.transaction('snap').objectStore('snap').index('ls').getAll(LS);q.onsuccess=()=>ok((q.result||[]).sort((a,b)=>b.t-a.t).map(x=>({id:x.id,t:x.t,motivo:x.motivo,kb:x.kb})));q.onerror=()=>ok([])})}catch(e){return[]}}
async function snapSave(motivo){try{const d=await snapOpen();const txt=JSON.stringify(DB);const rec={id:LS+'_'+Date.now(),ls:LS,t:Date.now(),motivo,kb:Math.round(txt.length/1024),data:txt};
 await new Promise((ok,ko)=>{const tx=d.transaction('snap','readwrite');tx.objectStore('snap').put(rec);tx.oncomplete=ok;tx.onerror=()=>ko(tx.error)});
 const L=await snapList();if(L.length>10){const tx=d.transaction('snap','readwrite');L.slice(10).forEach(x=>tx.objectStore('snap').delete(x.id))}DB.cfg.lastSnap=Date.now();save();return true}catch(e){console.warn('copia local',e);return false}}
async function snapGet(id){const d=await snapOpen();return new Promise((ok,ko)=>{const q=d.transaction('snap').objectStore('snap').get(id);q.onsuccess=()=>ok(q.result);q.onerror=()=>ko(q.error)})}
async function snapDel(id){const d=await snapOpen();return new Promise(ok=>{const tx=d.transaction('snap','readwrite');tx.objectStore('snap').delete(id);tx.oncomplete=ok})}

 return '<div class="card"><h3>Auditoría</h3><input id="cfauq" type="search" style="max-width:320px;margin-bottom:8px" placeholder="Filtrar por usuario o acción…" value="'+h(UI.cfAuQ)+'" data-chg="cfauq" aria-label="Filtrar auditoría"><div class="tw" style="max-height:460px"><table><thead><tr><th>Cuándo</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr></thead><tbody>'+(L.slice(0,200).map(a=>'<tr><td>'+ftime(a.t)+'</td><td>'+h(a.u)+'</td><td>'+h(a.a)+'</td><td>'+h(a.d)+'</td></tr>').join('')||'<tr><td colspan="4" class="mut c">Sin movimientos.</td></tr>')+'</tbody></table></div><p class="sm mut">Se guardan los últimos 400 movimientos.</p></div>'}
CHG.cfauq=t=>{UI.cfAuQ=t.value;const p=t.selectionStart;renderView();const n=$('#cfauq');if(n){n.focus();try{n.setSelectionRange(p,p)}catch(e){}}};

ACT.cftab=d=>{UI.cfTab=d.t;renderView();const b=$('#cfbody');if(b&&b.getBoundingClientRect().top<0)b.scrollIntoView({block:'start'})};
ACT.cfgo=d=>{UI.cfTab=d.t;if(d.t==='mo'&&d.f==='cfmoq'&&cfSinPrecio())UI.cfMoF='sin';renderView();setTimeout(()=>{const e=d.f&&document.getElementById(d.f);const tg=e?(e.closest('.cfrow')||e.closest('.f')||e):$('#cfbody .card');if(tg){tg.scrollIntoView({block:'center',behavior:'smooth'});tg.classList.add('cfhit');setTimeout(()=>tg.classList.remove('cfhit'),1700)}if(e&&e.focus)e.focus({preventScroll:true})},30)};
CHG.cfq=t=>{const r=$('#cfres');if(!r)return;const q=norm(t.value.trim());if(!q){r.hidden=true;r.innerHTML='';return}
 const tabs=cfTabs().map(x=>x[0]);const W=q.split(/\s+/);const wd=s=>norm(s).split(/[^a-z0-9ñ]+/).filter(Boolean);
 const hit=(s,w)=>wd(s).some(p=>p.startsWith(w))||(w.length>3&&typeof fz==='function'&&wd(s).some(p=>Math.abs(p.length-w.length)<=2&&fz(p,w)));
 const R=CFIDX.map(x=>[x,W.every(w=>hit(x[0],w))?2:W.every(w=>hit(x[0]+' '+x[1],w))?1:0]).filter(x=>x[1]&&tabs.includes(x[0][2])).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).slice(0,7);
 const N=Object.fromEntries(cfTabs().map(x=>[x[0],x[2]]));r.innerHTML=R.length?R.map(x=>'<button data-act="cfgo" data-t="'+x[2]+'" data-f="'+x[3]+'">'+h(x[0])+'<small>'+h(N[x[2]])+'</small></button>').join(''):'<div class="sm mut" style="padding:10px 12px">No encontré ese ajuste.</div>';r.hidden=false};
document.addEventListener('keydown',e=>{const t=e.target;if(!t||t.id!=='cfq')return;const r=$('#cfres');if(e.key==='Enter'){const b=r&&r.querySelector('button');if(b){e.preventDefault();b.click()}}else if(e.key==='Escape'){t.value='';if(r)r.hidden=true}else if(e.key==='ArrowDown'){const b=r&&r.querySelector('button');if(b){e.preventDefault();b.focus()}}});
document.addEventListener('keydown',e=>{const t=e.target;if(!t||!t.closest||!t.closest('#cfres'))return;if(e.key==='ArrowDown'&&t.nextElementSibling){e.preventDefault();t.nextElementSibling.focus()}else if(e.key==='ArrowUp'){e.preventDefault();(t.previousElementSibling||$('#cfq')).focus()}else if(e.key==='Escape'){$('#cfres').hidden=true;$('#cfq').focus()}});
document.addEventListener('click',e=>{const r=$('#cfres');if(r&&!r.hidden&&!(e.target.closest&&e.target.closest('.cfsrch')))r.hidden=true});
if(typeof UX_DESC!=='undefined')UX_DESC.config='Todo lo que se ajusta del sistema, por secciones. Usá el buscador de arriba para llegar directo a un ajuste. Los cambios se guardan solos.';
if(typeof UXKW!=='undefined')UXKW.config=(UXKW.config||'')+' ajustes preferencias opciones iva precios horario clave usuarios acceso oculto logo';

/* ---- Acceso oculto: doble clic / doble toque sobre el logo del menú público ---- */
(function(){let last=0,lx=0,ly=0,yendo=false;const sel='#pub .ph img';
 const ir=()=>{if(yendo||DB.cfg.accOculto===false)return;yendo=true;const u=location.href.split('#')[0]+sysHash();if(u===location.href)location.reload();else location.href=u};
 document.addEventListener('dblclick',e=>{if(e.target.closest&&e.target.closest(sel)){e.preventDefault();ir()}});
 document.addEventListener('touchend',e=>{if(!(e.target.closest&&e.target.closest(sel))||e.changedTouches.length!==1)return;const p=e.changedTouches[0],n=Date.now();
  if(n-last<450&&Math.abs(p.clientX-lx)<40&&Math.abs(p.clientY-ly)<40){e.preventDefault();last=0;ir()}else{last=n;lx=p.clientX;ly=p.clientY}},{passive:false});
 document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest(sel))e.preventDefault()})})();

(function init(){if(/menu/i.test(location.hash)){renderMenu();return}try{const id=sessionStorage.getItem(SS);if(id)ME=userOf(id)||null}catch(e){}if(ME)renderShell();else renderLogin()})();
</script>
