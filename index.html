<script>
/* ===== Proveedores y compras ===== */
V.compras=()=>{const tab=UI.compTab,deuda=DB.provs.reduce((a,p)=>a+provDeuda(p.id),0);let b='';
 if(tab==='prov')b='<div class="tw"><table><thead><tr><th>Proveedor</th><th>CUIT</th><th>Teléfono</th><th class="n">Deuda</th><th>Acciones</th></tr></thead><tbody>'+DB.provs.filter(p=>p.activo).map(p=>{const d=provDeuda(p.id);return '<tr><td><b>'+h(p.n)+'</b></td><td>'+h(p.cuit)+'</td><td>'+h(p.tel)+'</td><td class="n">'+(d>0.005?'<b style="color:var(--bad)">'+fmt(d)+'</b>':'—')+'</td><td><div class="row"><button class="btn s" data-act="ingnew" data-id="'+p.id+'">📥 Ingreso</button><button class="btn s" data-act="ocnew" data-id="'+p.id+'">OC</button><button class="btn s" data-act="ppago" data-id="'+p.id+'"'+(d>0.005?'':' disabled')+'>💵 Pago</button><button class="btn s" data-act="pnc" data-id="'+p.id+'"'+(d>0.005?'':' disabled')+'>NC</button><button class="btn s" data-act="plibro" data-id="'+p.id+'">Libro</button><button class="btn s" data-act="pedit" data-id="'+p.id+'">✎</button></div></td></tr>'}).join('')+'</tbody></table></div>';
 else if(tab==='oc')b='<div class="tw"><table><thead><tr><th>OC</th><th>Fecha</th><th>Proveedor</th><th>Ítems</th><th>Estado</th><th></th></tr></thead><tbody>'+(DB.ocs.length?DB.ocs.slice().reverse().map(o=>'<tr><td>OC-'+String(o.num).padStart(4,'0')+'</td><td>'+fdate(o.fecha)+'</td><td>'+h((provOf(o.provId)||{}).n)+'</td><td>'+o.lines.map(l=>l.qty+'× '+h((repOf(l.repId)||{}).desc)).join(', ')+'</td><td><span class="badge '+(o.estado==='Pendiente'?'warn':o.estado==='Recibida'?'ok':'')+'">'+o.estado+'</span></td><td>'+(o.estado==='Pendiente'?'<div class="row"><button class="btn s p" data-act="ocrecibir" data-id="'+o.id+'">Recibir</button><a class="btn s" target="_blank" rel="noopener" href="'+h(wa((provOf(o.provId)||{}).tel,'Pedido a '+(provOf(o.provId)||{}).n+' · '+DB.cfg.nombre+':\n'+o.lines.map(l=>l.qty+' × '+(repOf(l.repId)||{}).desc+' ('+(repOf(l.repId)||{}).cod+')').join('\n')))+'">WhatsApp</a><button class="btn s" data-act="ocanul" data-id="'+o.id+'">Anular</button></div>':'')+'</td></tr>').join(''):'<tr><td colspan="6" class="mut c">Sin órdenes de compra.</td></tr>')+'</tbody></table></div>';
 else{const falt=DB.repuestos.filter(r=>r.activo&&r.qty<=r.alarma);const by={};falt.forEach(r=>(by[r.provId]=by[r.provId]||[]).push(r));
  b=Object.keys(by).length?Object.keys(by).map(pid=>'<div class="card"><div class="row"><h3 class="sp">'+h(provOf(pid).n)+'</h3><button class="btn p s" data-act="ocsug" data-id="'+pid+'">Crear OC con lo sugerido</button></div><table><tbody>'+by[pid].map(r=>'<tr><td>'+h(r.desc)+' <span class="mut sm">'+h(r.marca)+'</span></td><td class="n">stock '+r.qty+'</td><td class="n">alarma '+r.alarma+'</td><td class="n">pedir <b>'+Math.max(1,r.repos-r.qty)+'</b></td></tr>').join('')+'</tbody></table></div>').join(''):'<p class="mut">No hay artículos en alarma.</p>'}
 return '<div class="bar"><h2>Proveedores y compras</h2><span class="sp"></span><span class="mut">Deuda total: <b style="color:'+(deuda>0?'var(--bad)':'inherit')+'">'+fmt(deuda)+'</b></span><button class="btn p" data-act="pnew">➕ Proveedor</button></div>'+
 '<div class="chips" style="margin-bottom:10px">'+[['prov','Proveedores'],['oc','Órdenes de compra'],['sug','Reposición sugerida']].map(t=>'<button class="chip'+(tab===t[0]?' on':'')+'" data-act="comptab" data-t="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>'+b};
ACT.comptab=d=>{UI.compTab=d.t;renderView()};
ACT.pnew=()=>ACT.pedit({id:''});
ACT.pedit=d=>{const p=d.id?provOf(d.id):{n:'',cuit:'',tel:'',mail:''};modal({title:d.id?'Editar proveedor':'Nuevo proveedor',body:'<div class="g2"><div class="f"><label for="pv_n">Razón social</label><input id="pv_n" value="'+h(p.n)+'"></div><div class="f"><label for="pv_c">CUIT</label><input id="pv_c" inputmode="numeric" placeholder="30-12345678-9" value="'+h(p.cuit)+'"></div><div class="f"><label for="pv_t">Teléfono</label><input id="pv_t" value="'+h(p.tel)+'"></div><div class="f"><label for="pv_m">Correo</label><input id="pv_m" type="email" value="'+h(p.mail)+'"></div></div>',
 onOk:()=>{const n=val('pv_n').trim();if(n.length<3){merr('Cargá la razón social.');return false}if(!cuitOk(val('pv_c'))){merr('CUIT inválido: revisá el dígito verificador.');return false}const c=cuitFmt(val('pv_c'));if(DB.provs.some(x=>x.cuit===c&&x!==p)){merr('Ya existe un proveedor con ese CUIT.');return false}
  const x=d.id?p:{id:uid('p'),activo:true};Object.assign(x,{n,cuit:c,tel:val('pv_t').trim(),mail:val('pv_m').trim()});if(!d.id)DB.provs.push(x);audit('Proveedor '+(d.id?'editado':'nuevo'),n);save();renderView();return true}})};
function ledgerAdd(provId,tipo,monto,ref,asig){const l={id:uid('lg'),provId,fecha:TODAY(),tipo,monto:r2(monto),ref:ref||'',asig:asig||[],u:ME.n};DB.ledger.push(l);return l}
ACT.plibro=d=>{const p=provOf(d.id);let s=0;const rows=DB.ledger.filter(l=>l.provId===d.id).sort((a,b)=>a.fecha<b.fecha?-1:1).map(l=>{s+=l.tipo==='Compra'?l.monto:-l.monto;return '<tr><td>'+fdate(l.fecha)+'</td><td>'+l.tipo+'</td><td>'+h(l.ref)+(l.asig&&l.asig.length?'<br><span class="sm mut">'+l.asig.map(a=>h((DB.cajas.find(c=>c.id===a.cajaId)||{}).n)+': '+fmt(a.monto)).join(' · ')+'</span>':'')+'</td><td class="n">'+(l.tipo==='Compra'?fmt(l.monto):'')+'</td><td class="n">'+(l.tipo!=='Compra'?fmt(l.monto):'')+'</td><td class="n"><b>'+fmt(s)+'</b></td></tr>'}).join('');
 modal({title:'Libro de '+p.n,wide:true,hideOk:true,cancel:'Cerrar',body:'<div class="tw"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Referencia</th><th class="n">Debe (compra)</th><th class="n">Haber (pago / NC)</th><th class="n">Saldo</th></tr></thead><tbody>'+(rows||'<tr><td colspan="6" class="mut c">Sin movimientos.</td></tr>')+'</tbody></table></div><p class="sm mut">El libro es sólo-agregar: las correcciones se hacen con notas de crédito o pagos compensatorios.</p>'})};
/* editor de líneas (ingreso / OC) */
function ingBody(){const I=UI.ing,p=provOf(I.provId);const pool=DB.repuestos.filter(r=>r.activo&&r.provId===I.provId);const lst=pool.length?pool:DB.repuestos.filter(r=>r.activo);let tot=0;
 const rows=I.lines.map((l,i)=>{const r=repOf(l.repId),t=r2(l.qty*l.costo*(1+r.iva/100));tot+=t;return '<tr><td>'+h(r.desc)+' <span class="mut sm">'+h(r.marca)+' · IVA '+r.iva+'%</span></td><td><input data-chg="lninp" data-i="'+i+'" data-f="qty" value="'+l.qty+'" inputmode="numeric" style="width:80px" aria-label="Cantidad"></td><td><input data-chg="lninp" data-i="'+i+'" data-f="costo" value="'+l.costo+'" inputmode="decimal" style="width:110px" aria-label="Costo unitario"></td><td class="n" id="ln_t'+i+'">'+fmt(t)+'</td><td><button class="btn s" data-act="lndel" data-i="'+i+'" aria-label="Quitar">✕</button></td></tr>'}).join('');
 return '<p>Proveedor: <b>'+h(p.n)+'</b> · deuda actual '+fmt(provDeuda(p.id))+'</p>'+
 (I.mode==='ing'?'<div class="g3"><div class="f"><label for="ig_ref">N° de remito / factura</label><input id="ig_ref" data-chg="ingf" data-f="ref" value="'+h(I.ref)+'"></div><div class="f"><label for="ig_forma">Forma de pago</label><select id="ig_forma" data-chg="ingf" data-f="forma"><option value="cc"'+(I.forma==='cc'?' selected':'')+'>A cuenta (queda deuda)</option><option value="ef"'+(I.forma==='ef'?' selected':'')+'>Contado en efectivo (sale de caja)</option></select></div>'+(I.forma==='ef'?'<div class="f"><label for="ig_caja">Caja</label><select id="ig_caja" data-chg="ingf" data-f="cajaId">'+opts(DB.cajas,I.cajaId,c=>[c.id,c.n+' · '+fmt(cajaEfectivo(c.id))])+'</select></div>':'')+'</div>':'<div class="f"><label for="ig_obs">Observaciones</label><input id="ig_obs" data-chg="ingf" data-f="obs" value="'+h(I.obs||'')+'"></div>')+
 '<div class="tw"><table class="itbl"><thead><tr><th>Artículo</th><th>Cantidad</th><th>Costo unit. (neto)</th><th class="n">Total c/IVA</th><th></th></tr></thead><tbody>'+(rows||'<tr><td colspan="5" class="mut c">Agregá artículos.</td></tr>')+'</tbody></table></div>'+
 '<div class="row" style="margin-top:8px"><select id="ln_add" style="max-width:420px" aria-label="Artículo">'+lst.map(r=>'<option value="'+r.id+'">'+h(r.desc+' · '+r.marca+' · stock '+r.qty)+'</option>').join('')+'</select><button class="btn s" data-act="lnadd">Agregar</button><span class="sp"></span><b>Total: <span id="ln_tot">'+fmt(tot)+'</span></b></div>'}
CHG.lninp=t=>{const l=UI.ing.lines[+t.dataset.i];l[t.dataset.f]=t.dataset.f==='qty'?(parseInt(t.value)||0):num(t.value);const r=repOf(l.repId);const c=$('#ln_t'+t.dataset.i);if(c)c.textContent=fmt(l.qty*l.costo*(1+r.iva/100));$('#ln_tot').textContent=fmt(UI.ing.lines.reduce((a,x)=>a+x.qty*x.costo*(1+repOf(x.repId).iva/100),0))};
CHG.ingf=t=>{UI.ing[t.dataset.f]=t.value;if(t.dataset.f==='forma')rerenderModalBody(ingBody())};
ACT.lnadd=()=>{const r=repOf(val('ln_add'));if(!r)return;const ex=UI.ing.lines.find(l=>l.repId===r.id);if(ex)ex.qty++;else UI.ing.lines.push({repId:r.id,qty:1,costo:r.pc});rerenderModalBody(ingBody())};
ACT.lndel=d=>{UI.ing.lines.splice(+d.i,1);rerenderModalBody(ingBody())};
function ingTotal(){return r2(UI.ing.lines.reduce((a,l)=>a+l.qty*l.costo*(1+repOf(l.repId).iva/100),0))}
function lineCheck(){const L=UI.ing.lines;if(!L.length)throw new Error('Agregá al menos un artículo.');L.forEach(l=>{if(!(l.qty>0))throw new Error('Hay cantidades inválidas.');if(!(l.costo>0))throw new Error('Hay costos inválidos (deben ser mayores a cero).')})}
ACT.ingnew=d=>{UI.ing={mode:'ing',provId:d.id,ocId:'',ref:'',forma:'cc',cajaId:'C1',lines:[]};ingOpen()};
function ingOpen(){modal({title:'Ingreso de mercadería',wide:true,ok:'Confirmar ingreso',body:ingBody(),noFocus:true,
 onOk:()=>{try{const I=UI.ing;lineCheck();if(I.ref.trim().length<3)throw new Error('Cargá el N° de remito o factura.');const tot=ingTotal();
  if(I.forma==='ef'){if(!DB.turno.abierto)throw new Error('Abrí el turno de caja para pagar en efectivo.');if(cajaEfectivo(I.cajaId)<tot-0.004)throw new Error('La caja no tiene efectivo suficiente ('+fmt(cajaEfectivo(I.cajaId))+').')}
  I.lines.forEach(l=>{const r=repOf(l.repId);stockMove(r,l.qty,'Ingreso de mercadería',I.ref.trim()+' · '+provOf(I.provId).n);if(Math.abs(r.pc-l.costo)>0.004){r.pAnt=r.pv;r.pc=r2(l.costo);r.pv=r2(r.pc*(1+r.gan/100));r.fAct=TODAY()}});
  const lg=ledgerAdd(I.provId,'Compra',tot,I.ref.trim());
  if(I.forma==='ef'){cajaMov(I.cajaId,'egreso','f4',tot,'Compra contado · '+provOf(I.provId).n+' · '+I.ref.trim());ledgerAdd(I.provId,'Pago',tot,'Contado · '+I.ref.trim(),[{cajaId:I.cajaId,monto:tot}])}
  if(I.ocId){const oc=DB.ocs.find(x=>x.id===I.ocId);if(oc)oc.estado='Recibida'}
  audit('Ingreso de mercadería',provOf(I.provId).n+' '+fmt(tot));save();closeModal();renderView();toast('Ingreso registrado · stock y costos actualizados');return false}catch(e){merr(e.message);return false}}})}
ACT.ocnew=d=>{UI.ing={mode:'oc',provId:d.id,lines:[],obs:''};ocOpen()};
function ocOpen(){modal({title:'Orden de compra',wide:true,ok:'Crear OC',body:ingBody(),noFocus:true,onOk:()=>{try{lineCheck();DB.seq.oc++;DB.ocs.push({id:uid('oc'),num:DB.seq.oc,provId:UI.ing.provId,fecha:TODAY(),lines:UI.ing.lines.map(l=>({repId:l.repId,qty:l.qty,costo:l.costo})),estado:'Pendiente',obs:UI.ing.obs||''});audit('OC creada','OC-'+DB.seq.oc);save();UI.compTab='oc';closeModal();renderView();toast('OC creada');return false}catch(e){merr(e.message);return false}}})}
ACT.ocsug=d=>{const L=DB.repuestos.filter(r=>r.activo&&r.provId===d.id&&r.qty<=r.alarma).map(r=>({repId:r.id,qty:Math.max(1,r.repos-r.qty),costo:r.pc}));UI.ing={mode:'oc',provId:d.id,lines:L,obs:'Reposición sugerida'};ocOpen()};
ACT.ocrecibir=d=>{const o=DB.ocs.find(x=>x.id===d.id);UI.ing={mode:'ing',provId:o.provId,ocId:o.id,ref:'',forma:'cc',cajaId:'C1',lines:o.lines.map(l=>({repId:l.repId,qty:l.qty,costo:l.costo}))};ingOpen()};
ACT.ocanul=d=>confirmBox('¿Anular esta orden de compra?',()=>{DB.ocs.find(x=>x.id===d.id).estado='Anulada';audit('OC anulada');save();renderView()},'Anular');
ACT.ppago=d=>{const p=provOf(d.id),deu=provDeuda(d.id);UI.pp={id:d.id};
 modal({title:'Pago a '+p.n,wide:true,ok:'Registrar pago',body:'<p>Deuda: <b>'+fmt(deu)+'</b></p><div class="g3"><div class="f"><label for="pp_m">Monto del pago</label><input id="pp_m" inputmode="decimal" value="'+deu+'" data-chg="ppcalc"></div><div class="f"><label for="pp_k">Medio</label><select id="pp_k" data-chg="ppcalc"><option value="ef">Efectivo (de una o varias cajas)</option><option value="tr">Transferencia</option></select></div><div class="f"><label for="pp_r">Referencia / comprobante</label><input id="pp_r" placeholder="Recibo, N° de transferencia…"></div></div><div id="pp_cj"></div><div id="pp_res" class="demoflag" style="background:#eef6ff;border-color:#b9d6f7;color:#12406f"></div>',calc:()=>{ppRows();CHG.ppcalc({id:'x'})},
 onOk:()=>{try{const r=ppCalc();if(r.err)throw new Error(r.err);if(val('pp_r').trim().length<3)throw new Error('Cargá la referencia del pago.');
  const m=r2(num(val('pp_m')));if(val('pp_k')==='ef'){if(!DB.turno.abierto)throw new Error('Abrí el turno de caja.');const lg=ledgerAdd(p.id,'Pago',m,val('pp_r').trim(),r.asig);r.asig.forEach(a=>cajaMov(a.cajaId,'egreso','f4',a.monto,'Pago a '+p.n+' · '+val('pp_r').trim(),{lg:lg.id}))}else ledgerAdd(p.id,'Pago',m,'Transferencia · '+val('pp_r').trim(),[]);
  audit('Pago a proveedor',p.n+' '+fmt(m));save();closeModal();renderView();toast('Pago registrado');return false}catch(e){merr(e.message);return false}}})};
function ppRows(){const el=$('#pp_cj');if(!el)return;el.innerHTML=val('pp_k')==='ef'?'<h3>Reparto entre cajas (efectivo disponible)</h3><div class="g3">'+(DB.turno.abierto?DB.cajas.map(c=>'<div class="f"><label for="pp_c_'+c.id+'">'+h(c.n)+' · disponible '+fmt(cajaEfectivo(c.id))+'</label><input id="pp_c_'+c.id+'" data-chg="ppcalc" inputmode="decimal" placeholder="0,00"></div>').join(''):'<p class="mut">Turno de caja cerrado.</p>')+'</div>':''}
function ppCalc(){const m=r2(num(val('pp_m'))),deu=provDeuda(UI.pp.id);if(!(m>0))return{err:'Ingresá el monto.'};if(m>deu+0.004)return{err:'El pago supera la deuda ('+fmt(deu)+').'};
 if(val('pp_k')!=='ef')return{asig:[],resta:0,ok:true};let s=0;const asig=[];for(const c of DB.cajas){const el=document.getElementById('pp_c_'+c.id);const v=el?r2(num(el.value)):0;if(v<0)return{err:'Importe negativo.'};if(v>0){if(v>cajaEfectivo(c.id)+0.004)return{err:'La '+c.n+' no tiene efectivo suficiente.'};asig.push({cajaId:c.id,monto:v});s+=v}}
 s=r2(s);if(Math.abs(s-m)>0.004)return{err:'El reparto ('+fmt(s)+') debe sumar exactamente '+fmt(m)+' (faltan '+fmt(m-s)+').',asig,soft:true};return{asig,ok:true}}
CHG.ppcalc=t=>{if(t.id==='pp_k')ppRows();if(!$('#pp_res'))return;const r=ppCalc();$('#pp_res').innerHTML=r.err?'⚠ '+h(r.err):'✔ Todo en orden: el pago se registra de una sola vez (todo o nada).'};
ACT.pnc=d=>{const p=provOf(d.id);modal({title:'Nota de crédito de '+p.n,ok:'Registrar NC',body:'<div class="g2"><div class="f"><label for="nc_m">Monto</label><input id="nc_m" inputmode="decimal"></div><div class="f"><label for="nc_r">Motivo / N° de NC</label><input id="nc_r"></div></div>',onOk:()=>{const m=r2(num(val('nc_m')));if(!(m>0)){merr('Monto inválido.');return false}if(m>provDeuda(p.id)+0.004){merr('La NC supera la deuda.');return false}if(val('nc_r').trim().length<3){merr('Indicá el motivo o N° de NC.');return false}ledgerAdd(p.id,'NC',m,val('nc_r').trim());audit('NC de proveedor',p.n+' '+fmt(m));save();renderView();return true}})};

/* ===== Caja ===== */
V.caja=()=>{const T=DB.turno;let b='';
 if(!T.abierto){b='<div class="card"><h3>Turno de caja cerrado</h3><p class="mut">Abrí el turno con el efectivo inicial de cada caja para poder cobrar en efectivo y pagar proveedores.</p><div class="g3">'+DB.cajas.map(c=>'<div class="f"><label for="ap_'+c.id+'">Apertura · '+h(c.n)+'</label><input id="ap_'+c.id+'" inputmode="decimal" value="0"></div>').join('')+'</div><button class="btn p" data-act="cajaabrir">Abrir turno</button></div>'}
 else{const ms=DB.movs.filter(m=>m.turnoId===T.id).sort((a,b)=>b.t-a.t);
  b='<div class="g3" style="margin-bottom:12px">'+DB.cajas.map(c=>'<div class="kpi" style="cursor:default"><div class="l">'+h(c.n)+(c.principal?' · principal':'')+'</div><div class="v">'+fmt(cajaEfectivo(c.id))+'</div><div class="sm mut">Apertura '+fmt(T.apert[c.id]||0)+'</div></div>').join('')+'</div>'+
  '<div class="row" style="margin-bottom:10px"><button class="btn p" data-act="cajamov" data-t="ingreso">➕ Ingreso</button><button class="btn" data-act="cajamov" data-t="egreso">➖ Egreso</button><button class="btn" data-act="cajatras">⇄ Traspaso entre cajas</button><span class="sp"></span><button class="btn d" data-act="cajacierre">Arqueo y cierre de turno</button></div>'+
  '<div class="chips" style="margin-bottom:8px">'+[['mov','Movimientos del turno'],['ne','Cobros de hoy por medio'],['hist','Turnos cerrados']].map(t=>'<button class="chip'+(UI.cajaTab===t[0]?' on':'')+'" data-act="cajatab" data-t="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>'+cajaTabBody(ms)}
 if(!T.abierto)b+='<h3>Turnos cerrados</h3>'+cajaHist();
 return '<div class="bar"><h2>Caja</h2><span class="badge '+(T.abierto?'ok':'warn')+'">'+(T.abierto?'Turno abierto · '+fdate(T.fecha)+' · '+h(T.por):'Cerrado')+'</span></div>'+b};
function cajaTabBody(ms){if(UI.cajaTab==='hist')return cajaHist();
 if(UI.cajaTab==='ne'){const by={};DB.ots.forEach(o=>o.pagos.forEach(p=>{if(p.fecha===TODAY())by[p.medio]=(by[p.medio]||0)+p.monto}));const k=Object.keys(by);return '<div class="tw"><table><thead><tr><th>Medio</th><th class="n">Cobrado hoy</th></tr></thead><tbody>'+(k.length?k.map(x=>'<tr><td>'+x+'</td><td class="n">'+fmt(by[x])+'</td></tr>').join(''):'<tr><td colspan="2" class="mut c">Sin cobros hoy.</td></tr>')+'</tbody></table></div><p class="sm mut">Transferencias y tarjetas no pasan por el efectivo de caja; la cuenta corriente es deuda del cliente.</p>'}
 return '<div class="tw"><table><thead><tr><th>Hora</th><th>Caja</th><th>Tipo</th><th>Rubro</th><th>Detalle</th><th>Usuario</th><th class="n">Importe</th></tr></thead><tbody>'+(ms.length?ms.map(m=>'<tr><td>'+new Date(m.t).toTimeString().slice(0,5)+'</td><td>'+h((DB.cajas.find(c=>c.id===m.cajaId)||{}).n)+'</td><td>'+(m.tr?'Traspaso':m.tipo)+'</td><td>'+h((rubFin(m.conc)||{}).n)+'</td><td>'+h(m.ref)+'</td><td>'+h(m.u)+'</td><td class="n" style="color:'+(m.tipo==='ingreso'?'var(--ok)':'var(--bad)')+'">'+(m.tipo==='ingreso'?'+':'−')+fmt(m.monto)+'</td></tr>').join(''):'<tr><td colspan="7" class="mut c">Sin movimientos en este turno.</td></tr>')+'</tbody></table></div>'}
function cajaHist(){return DB.hist.length?'<div class="tw"><table><thead><tr><th>Turno</th><th>Fecha</th><th>Cerró</th><th>Arqueo por caja</th><th>Motivo de diferencia</th></tr></thead><tbody>'+DB.hist.slice().reverse().map(x=>'<tr><td>'+h(x.id)+'</td><td>'+fdate(x.fecha)+'</td><td>'+h(x.por)+'</td><td>'+x.cierres.map(c=>h(c.n)+': esperado '+fmt(c.esp)+' · contado '+fmt(c.cont)+' · <b style="color:'+(Math.abs(c.dif)>0.004?'var(--bad)':'var(--ok)')+'">dif. '+fmt(c.dif)+'</b>').join('<br>')+'</td><td>'+h(x.motivo||'—')+'</td></tr>').join('')+'</tbody></table></div>':'<p class="mut">Todavía no hay turnos cerrados.</p>'}
ACT.cajatab=d=>{UI.cajaTab=d.t;renderView()};
ACT.cajaabrir=()=>{const ap={};for(const c of DB.cajas){const v=r2(num(val('ap_'+c.id)));if(v<0){toast('Apertura negativa.',1);return}ap[c.id]=v}DB.seq.tc++;DB.turno={abierto:true,id:'T'+DB.seq.tc,fecha:TODAY(),apert:ap,por:ME.n};audit('Turno de caja abierto',DB.turno.id);save();renderView();toast('Turno abierto')};
ACT.cajamov=d=>{const ing=d.t==='ingreso';modal({title:ing?'Ingreso manual de efectivo':'Egreso de efectivo',ok:'Registrar',body:'<div class="g2"><div class="f"><label for="cm_c">Caja</label><select id="cm_c">'+opts(DB.cajas,'C1',c=>[c.id,c.n+' · '+fmt(cajaEfectivo(c.id))])+'</select></div><div class="f"><label for="cm_r">Rubro financiero (obligatorio)</label><select id="cm_r">'+opts(DB.rubrosFin.filter(r=>r.t===(ing?'ing':'egr')),'',r=>[r.id,r.n],'— elegir rubro —')+'</select></div><div class="f"><label for="cm_m">Monto</label><input id="cm_m" inputmode="decimal"></div><div class="f"><label for="cm_d">Detalle</label><input id="cm_d" placeholder="Qué es y a quién"></div></div>',
 onOk:()=>{const m=r2(num(val('cm_m')));if(!val('cm_r')){merr('Elegí el rubro financiero.');return false}if(!(m>0)){merr('Monto inválido.');return false}if(val('cm_d').trim().length<3){merr('Escribí el detalle.');return false}if(!ing&&m>cajaEfectivo(val('cm_c'))+0.004){merr('La caja no tiene efectivo suficiente.');return false}
  cajaMov(val('cm_c'),d.t,val('cm_r'),m,val('cm_d').trim());audit('Caja '+d.t,fmt(m)+' · '+val('cm_d').trim());save();renderView();return true}})};
ACT.cajatras=()=>{modal({title:'Traspaso entre cajas',ok:'Traspasar',body:'<div class="g2"><div class="f"><label for="tr_o">Desde</label><select id="tr_o">'+opts(DB.cajas,'C1',c=>[c.id,c.n+' · '+fmt(cajaEfectivo(c.id))])+'</select></div><div class="f"><label for="tr_d">Hacia</label><select id="tr_d">'+opts(DB.cajas,'C2',c=>[c.id,c.n])+'</select></div><div class="f"><label for="tr_m">Monto</label><input id="tr_m" inputmode="decimal"></div><div class="f"><label for="tr_r">Rubro'+(DB.cfg.traspasoSinRubro?' (opcional: usa “Traspaso interno”)':' (obligatorio)')+'</label><select id="tr_r">'+opts(DB.rubrosFin.filter(r=>!r.oculto),'',r=>[r.id,r.n],DB.cfg.traspasoSinRubro?'Traspaso interno':'— elegir rubro —')+'</select></div><div class="f"><label for="tr_c">Comprobante N°</label><input id="tr_c"></div><div class="f"><label for="tr_a">Autoriza</label><select id="tr_a">'+opts(DB.users.filter(u=>u.rol==='dueno'||u.rol==='jefe'),'',u=>[u.n,u.n],'— elegir —')+'</select></div></div>',
 onOk:()=>{const o=val('tr_o'),dd=val('tr_d'),m=r2(num(val('tr_m')));if(o===dd){merr('Origen y destino deben ser distintos.');return false}if(!(m>0)){merr('Monto inválido.');return false}if(m>cajaEfectivo(o)+0.004){merr('La caja de origen no tiene efectivo suficiente.');return false}
  let rub=val('tr_r');if(!rub){if(DB.cfg.traspasoSinRubro)rub='sys';else{merr('Elegí el rubro financiero.');return false}}if(val('tr_c').trim().length<2){merr('Cargá el N° de comprobante.');return false}if(!val('tr_a')){merr('Indicá quién autoriza.');return false}
  const tid=uid('tr'),ref='Traspaso '+(DB.cajas.find(c=>c.id===o)||{}).n+' → '+(DB.cajas.find(c=>c.id===dd)||{}).n+' · comp. '+val('tr_c').trim()+' · autoriza '+val('tr_a');cajaMov(o,'egreso',rub,m,ref,{tr:tid});cajaMov(dd,'ingreso',rub,m,ref,{tr:tid});audit('Traspaso entre cajas',fmt(m)+' · '+val('tr_c').trim());save();renderView();return true}})};
ACT.cajacierre=()=>{modal({title:'Arqueo y cierre del turno',ok:'Cerrar turno',wide:true,body:'<p class="sm mut">Contá el efectivo de cada caja. Si hay diferencia, el motivo es obligatorio.</p><div class="tw"><table class="itbl"><thead><tr><th>Caja</th><th class="n">Esperado</th><th>Contado</th><th class="n">Diferencia</th></tr></thead><tbody>'+DB.cajas.map(c=>'<tr><td>'+h(c.n)+'</td><td class="n">'+fmt(cajaEfectivo(c.id))+'</td><td><input id="ar_'+c.id+'" data-chg="arcalc" inputmode="decimal" placeholder="0,00"></td><td class="n" id="ard_'+c.id+'">—</td></tr>').join('')+'</tbody></table></div><div class="f" style="margin-top:10px"><label for="ar_m">Motivo de la diferencia (si corresponde)</label><input id="ar_m"></div>',
 onOk:()=>{const ci=[];let dif=false;for(const c of DB.cajas){const raw=val('ar_'+c.id).trim();if(raw===''){merr('Contá el efectivo de '+c.n+'.');return false}const cont=r2(num(raw)),esp=cajaEfectivo(c.id),d=r2(cont-esp);if(cont<0){merr('Importe negativo.');return false}if(Math.abs(d)>0.004)dif=true;ci.push({cajaId:c.id,n:c.n,esp,cont,dif:d})}
  if(dif&&val('ar_m').trim().length<4){merr('Hay diferencias: indicá el motivo.');return false}DB.hist.push({id:DB.turno.id,fecha:DB.turno.fecha,por:ME.n,cierres:ci,motivo:val('ar_m').trim()});DB.turno={abierto:false,id:DB.turno.id,fecha:DB.turno.fecha,apert:{},por:''};audit('Turno de caja cerrado',DB.hist[DB.hist.length-1].id);save();closeModal();renderView();toast('Turno cerrado');return false}})};
CHG.arcalc=t=>{const id=t.id.slice(3);const esp=cajaEfectivo(id),e=document.getElementById('ard_'+id);if(t.value.trim()===''){e.textContent='—';return}const d=r2(num(t.value)-esp);e.innerHTML='<b style="color:'+(Math.abs(d)>0.004?'var(--bad)':'var(--ok)')+'">'+fmt(d)+'</b>'};

/* ===== Equipamiento ===== */
V.equipo=()=>{const cats=[...new Set(DB.equip.map(e=>e.cat))];const l=DB.equip.filter(e=>!UI.eqCat||e.cat===UI.eqCat);const ok=DB.equip.filter(e=>e.est==='ok').length,pct=Math.round(ok/DB.equip.length*100);const ed=isBoss();
 return '<div class="bar"><h2>Equipamiento y habilitación del taller</h2><span class="sp"></span>'+(ed?'<button class="btn s" data-act="eqcsv">Lista de faltantes (Excel)</button>':'')+'</div>'+
 '<div class="card"><div class="row"><b>Taller listo: '+pct+' %</b><span class="mut sm">'+ok+' de '+DB.equip.length+' ítems disponibles · '+DB.equip.filter(e=>e.est==='falta').length+' faltan · '+DB.equip.filter(e=>e.est==='mant').length+' en mantenimiento</span></div><div class="pbar" style="margin-top:6px" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pct+'%"></i></div></div>'+
 '<div class="chips" style="margin-bottom:10px"><button class="chip'+(!UI.eqCat?' on':'')+'" data-act="eqcat" data-c="">Todo</button>'+cats.map(c=>'<button class="chip'+(UI.eqCat===c?' on':'')+'" data-act="eqcat" data-c="'+h(c)+'">'+h(c)+'</button>').join('')+'</div>'+
 '<div class="tw"><table class="itbl"><thead><tr><th>Ítem</th><th>Estado</th><th>Cant.</th><th>Próx. calibración / service</th><th>Nota</th></tr></thead><tbody>'+l.map(e=>'<tr><td><span class="mut sm">'+h(e.cat)+'</span><br>'+h(e.n)+'</td><td><select data-chg="eqf" data-id="'+e.id+'" data-f="est" aria-label="Estado"'+(ed?'':' disabled')+'><option value="ok"'+(e.est==='ok'?' selected':'')+'>Disponible</option><option value="falta"'+(e.est==='falta'?' selected':'')+'>Falta</option><option value="mant"'+(e.est==='mant'?' selected':'')+'>En mantenimiento</option></select></td><td><input style="width:70px" data-chg="eqf" data-id="'+e.id+'" data-f="cant" value="'+e.cant+'" inputmode="numeric"'+(ed?'':' disabled')+' aria-label="Cantidad"></td><td><input type="date" data-chg="eqf" data-id="'+e.id+'" data-f="prox" value="'+h(e.prox)+'"'+(ed?'':' disabled')+' aria-label="Próxima calibración">'+(e.prox&&daysTo(e.prox)<=30?' <span class="badge '+(daysTo(e.prox)<0?'bad':'warn')+'">'+(daysTo(e.prox)<0?'vencido':'en '+daysTo(e.prox)+' d')+'</span>':'')+'</td><td><input data-chg="eqf" data-id="'+e.id+'" data-f="nota" value="'+h(e.nota)+'"'+(ed?'':' disabled')+' aria-label="Nota"></td></tr>').join('')+'</tbody></table></div>'};
ACT.eqcat=d=>{UI.eqCat=d.c;renderView()};
CHG.eqf=t=>{const e=DB.equip.find(x=>x.id===t.dataset.id);if(!e||!isBoss())return;const f=t.dataset.f;e[f]=f==='cant'?(parseInt(t.value)||0):t.value;audit('Equipamiento',e.n+' · '+f+' = '+t.value);save();if(f==='est')renderView()};
ACT.eqcsv=()=>csvDown('equipamiento_faltante.csv',[['Categoría','Ítem','Estado','Cantidad requerida']].concat(DB.equip.filter(e=>e.est!=='ok').map(e=>[e.cat,e.n,e.est==='falta'?'Falta':'En mantenimiento',e.cant])));

/* ===== Seguridad y medio ambiente ===== */
V.seguridad=()=>{const t=UI.segTab;let b='';const ed=isBoss()||ME.rol==='mecanico';
 if(t==='epp')b='<div class="tw"><table><thead><tr><th>Elemento de protección personal</th><th class="n">Stock</th><th class="n">Mínimo</th><th></th></tr></thead><tbody>'+DB.epp.map(e=>'<tr><td>'+h(e.n)+(e.stock<e.min?' <span class="badge warn">bajo mínimo</span>':'')+'</td><td class="n">'+e.stock+'</td><td class="n">'+e.min+'</td><td><div class="row"><button class="btn s" data-act="eppent" data-id="'+e.id+'">Entregar a personal</button>'+(isBoss()?'<button class="btn s" data-act="eppadd" data-id="'+e.id+'">+ Ingreso</button>':'')+'</div></td></tr>').join('')+'</tbody></table></div><h3 style="margin-top:12px">Entregas registradas</h3>'+(DB.entregas.length?'<div class="tw"><table><tbody>'+DB.entregas.slice(0,15).map(x=>'<tr><td>'+fdate(x.fecha)+'</td><td>'+h(x.pers)+'</td><td>'+h(x.n)+' × '+x.cant+'</td></tr>').join('')+'</tbody></table></div>':'<p class="mut">Sin entregas.</p>');
 else if(t==='ext')b='<div class="tw"><table><thead><tr><th>Ubicación</th><th>Tipo</th><th>Vencimiento de carga</th><th></th></tr></thead><tbody>'+DB.extint.map(x=>{const d=daysTo(x.venc);return '<tr><td>'+h(x.ubic)+'</td><td>'+h(x.tipo)+'</td><td>'+fdate(x.venc)+' <span class="badge '+(d<0?'bad':d<=30?'warn':'ok')+'">'+(d<0?'vencido':d<=30?'en '+d+' d':'vigente')+'</span></td><td>'+(isBoss()?'<button class="btn s" data-act="extrec" data-id="'+x.id+'">Registrar recarga</button>':'')+'</td></tr>'}).join('')+'</tbody></table></div><p class="sm mut">Plazos de recarga y señalética exigida: [VERIFICAR] con el prestador habilitado y la normativa vigente.</p>'+(isBoss()?'<button class="btn s" data-act="extnew">➕ Agregar extintor</button>':'');
 else if(t==='res'){const tipos=['Aceite usado','Baterías','Filtros usados','Líquido refrigerante','Sólidos contaminados'];b='<div class="g4" style="margin-bottom:10px">'+tipos.map(x=>'<div class="kpi" style="cursor:default"><div class="v">'+resStock(x)+' <span class="sm">'+((DB.resid.find(r=>r.tipo===x)||{unidad:x==='Baterías'||x==='Filtros usados'?'u':x==='Sólidos contaminados'?'kg':'L'}).unidad)+'</span></div><div class="l">'+x+' acumulado</div></div>').join('')+'</div>'+(isBoss()?'<div class="row" style="margin-bottom:8px"><button class="btn s" data-act="resgen">➕ Registrar generación</button><button class="btn s p" data-act="resret">🚛 Registrar retiro del gestor</button></div>':'')+'<div class="tw"><table><thead><tr><th>Fecha</th><th>Tipo</th><th class="n">Cantidad</th><th>Referencia</th></tr></thead><tbody>'+DB.resid.slice().sort((a,b)=>a.fecha<b.fecha?1:-1).slice(0,30).map(r=>'<tr><td>'+fdate(r.fecha)+'</td><td>'+h(r.tipo)+'</td><td class="n" style="color:'+(r.cant<0?'var(--ok)':'inherit')+'">'+(r.cant>0?'+':'')+r.cant+' '+r.unidad+'</td><td>'+h(r.ref)+'</td></tr>').join('')+'</tbody></table></div><p class="sm mut">La generación se carga sola al entregar una OT con aceite, filtros o baterías. Requisitos de gestión de residuos peligrosos: [VERIFICAR] con la autoridad ambiental.</p>'}
 else b='<div class="tw"><table><thead><tr><th>Habilitación / seguro</th><th>Ente</th><th>Vencimiento</th><th></th></tr></thead><tbody>'+DB.habil.map(x=>{const d=daysTo(x.venc);return '<tr><td>'+h(x.n)+'</td><td>'+h(x.ent)+'</td><td>'+fdate(x.venc)+' <span class="badge '+(d<0?'bad':d<=30?'warn':'ok')+'">'+(d<0?'vencida':d<=30?'en '+d+' d':'vigente')+'</span></td><td>'+(isBoss()?'<button class="btn s" data-act="habren" data-id="'+x.id+'">Renovar</button>':'')+'</td></tr>'}).join('')+'</tbody></table></div><p class="sm mut">Requisitos y plazos: [VERIFICAR] con el municipio, la ART y la aseguradora. Los datos cargados son de ejemplo.</p>'+(isBoss()?'<button class="btn s" data-act="habnew">➕ Agregar</button>':'');
 return '<div class="bar"><h2>Seguridad y medio ambiente</h2></div><div class="chips" style="margin-bottom:10px">'+[['epp','EPP'],['ext','Extintores'],['res','Residuos peligrosos'],['hab','Habilitaciones y seguros']].map(x=>'<button class="chip'+(t===x[0]?' on':'')+'" data-act="segtab" data-t="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>'+b};
ACT.segtab=d=>{UI.segTab=d.t;renderView()};
ACT.eppent=d=>{const e=DB.epp.find(x=>x.id===d.id);modal({title:'Entregar: '+e.n,ok:'Registrar entrega',body:'<div class="g2"><div class="f"><label for="ee_p">Personal</label><select id="ee_p">'+opts(DB.users.filter(u=>u.rol!=='dueno'),'',u=>[u.n,u.n],'— elegir —')+'</select></div><div class="f"><label for="ee_c">Cantidad</label><input id="ee_c" type="number" min="1" value="1"></div></div><p class="mut sm">Stock disponible: '+e.stock+'</p>',onOk:()=>{const c=parseInt(val('ee_c'));if(!val('ee_p')){merr('Elegí a quién se entrega.');return false}if(!(c>0)||c>e.stock){merr('Cantidad inválida o mayor al stock.');return false}e.stock-=c;DB.entregas.unshift({fecha:TODAY(),pers:val('ee_p'),n:e.n,cant:c});audit('Entrega de EPP',e.n+' × '+c+' a '+val('ee_p'));save();renderView();return true}})};
ACT.eppadd=d=>{const e=DB.epp.find(x=>x.id===d.id);modal({title:'Ingreso de '+e.n,ok:'Sumar',body:'<div class="f"><label for="ea_c">Cantidad que ingresa</label><input id="ea_c" type="number" min="1" value="1"></div>',onOk:()=>{const c=parseInt(val('ea_c'));if(!(c>0)){merr('Cantidad inválida.');return false}e.stock+=c;audit('Ingreso de EPP',e.n+' × '+c);save();renderView();return true}})};
ACT.extrec=d=>{const x=DB.extint.find(y=>y.id===d.id);modal({title:'Recarga de extintor',ok:'Guardar',body:'<p>'+h(x.ubic)+' · '+h(x.tipo)+'</p><div class="f"><label for="xr_f">Nuevo vencimiento de carga</label><input type="date" id="xr_f" value="'+addDays(365)+'"></div>',onOk:()=>{if(!val('xr_f')||val('xr_f')<=TODAY()){merr('La nueva fecha debe ser posterior a hoy.');return false}x.venc=val('xr_f');audit('Extintor recargado',x.ubic);save();renderView();return true}})};
ACT.extnew=()=>{modal({title:'Nuevo extintor',ok:'Agregar',body:'<div class="g3"><div class="f"><label for="xn_u">Ubicación</label><input id="xn_u"></div><div class="f"><label for="xn_t">Tipo / capacidad</label><input id="xn_t" placeholder="ABC 5 kg"></div><div class="f"><label for="xn_f">Vencimiento de carga</label><input type="date" id="xn_f"></div></div>',onOk:()=>{if(val('xn_u').trim().length<3||!val('xn_t').trim()||!val('xn_f')){merr('Completá ubicación, tipo y vencimiento.');return false}DB.extint.push({id:uid('x'),ubic:val('xn_u').trim(),tipo:val('xn_t').trim(),venc:val('xn_f')});audit('Extintor agregado',val('xn_u'));save();renderView();return true}})};
ACT.resgen=()=>resForm('gen');ACT.resret=()=>resForm('ret');
function resForm(k){const tipos=['Aceite usado','Baterías','Filtros usados','Líquido refrigerante','Sólidos contaminados'];modal({title:k==='gen'?'Registrar generación de residuo':'Retiro por gestor autorizado',ok:'Registrar',body:'<div class="g2"><div class="f"><label for="rs_t">Tipo</label><select id="rs_t">'+opts(tipos,'',x=>[x,x])+'</select></div><div class="f"><label for="rs_c">Cantidad</label><input id="rs_c" inputmode="decimal"></div>'+(k==='ret'?'<div class="f"><label for="rs_g">Gestor</label><input id="rs_g" placeholder="Razón social del gestor"></div><div class="f"><label for="rs_n">N° de certificado / manifiesto</label><input id="rs_n"></div>':'<div class="f"><label for="rs_n">Referencia</label><input id="rs_n" placeholder="Origen del residuo"></div>')+'</div>',
 onOk:()=>{const t=val('rs_t'),c=num(val('rs_c'));if(!(c>0)){merr('Cantidad inválida.');return false}const u=t==='Baterías'||t==='Filtros usados'?'u':t==='Sólidos contaminados'?'kg':'L';if(k==='ret'){if(c>resStock(t)+0.0001){merr('No podés retirar más de lo acumulado ('+resStock(t)+' '+u+').');return false}if(val('rs_g').trim().length<3||val('rs_n').trim().length<3){merr('Cargá gestor y N° de certificado.');return false}}
  DB.resid.push({id:uid('z'),fecha:TODAY(),tipo:t,cant:k==='ret'?-c:c,unidad:u,ref:k==='ret'?'Retiro '+val('rs_g').trim()+' · cert. '+val('rs_n').trim():(val('rs_n').trim()||'Carga manual')});audit('Residuos',(k==='ret'?'Retiro ':'Generación ')+t+' '+c);save();renderView();return true}})}
ACT.habren=d=>{const x=DB.habil.find(y=>y.id===d.id);modal({title:'Renovar: '+x.n,ok:'Guardar',body:'<div class="f"><label for="hr_f">Nuevo vencimiento</label><input type="date" id="hr_f" value="'+addDays(365)+'"></div>',onOk:()=>{if(!val('hr_f')||val('hr_f')<=TODAY()){merr('La fecha debe ser posterior a hoy.');return false}x.venc=val('hr_f');audit('Renovación',x.n);save();renderView();return true}})};
ACT.habnew=()=>{modal({title:'Nueva habilitación o seguro',ok:'Agregar',body:'<div class="g3"><div class="f"><label for="hn_n">Nombre</label><input id="hn_n"></div><div class="f"><label for="hn_e">Ente / aseguradora</label><input id="hn_e"></div><div class="f"><label for="hn_f">Vencimiento</label><input type="date" id="hn_f"></div></div>',onOk:()=>{if(val('hn_n').trim().length<3||!val('hn_f')){merr('Completá nombre y vencimiento.');return false}DB.habil.push({id:uid('h'),n:val('hn_n').trim(),ent:val('hn_e').trim(),venc:val('hn_f')});audit('Habilitación agregada',val('hn_n'));save();renderView();return true}})};

/* ===== Personal ===== */
V.personal=()=>{const ini=TODAY().slice(0,8)+'01';return '<div class="bar"><h2>Personal</h2><span class="sp"></span>'+(ME.rol==='dueno'?'<button class="btn p" data-act="peredit" data-id="">➕ Agregar persona</button>':'')+'</div><div class="tw"><table><thead><tr><th>Nombre</th><th>Rol</th><th>Especialidad</th><th class="n">% comisión MO</th><th class="n">OT activas</th><th class="n">OT entregadas (mes)</th><th class="n">Comisión estimada (mes)</th></tr></thead><tbody>'+DB.users.map(u=>{const a=DB.ots.filter(o=>o.mecId===u.id&&o.estado!=='Entregado').length,e=DB.ots.filter(o=>o.mecId===u.id&&o.estado==='Entregado'&&o.entregada>=ini);const mo=e.reduce((s,o)=>s+otTotal(o).mo,0);return '<tr'+(ME.rol==='dueno'?' class="clk" data-act="peredit" data-id="'+u.id+'"':'')+'><td><b>'+h(u.n)+'</b></td><td>'+ROL[u.rol]+'</td><td>'+h(u.esp)+'</td><td class="n">'+u.com+'%</td><td class="n">'+a+'</td><td class="n">'+e.length+'</td><td class="n">'+(u.com?fmt(mo*u.com/100):'—')+'</td></tr>'}).join('')+'</tbody></table></div><p class="sm mut">La comisión estimada se calcula sobre la mano de obra neta de las OT entregadas en el mes.</p>'};
ACT.peredit=d=>{const u=d.id?userOf(d.id):{n:'',rol:'mecanico',esp:'',com:0};modal({title:d.id?'Editar persona':'Nueva persona',ok:'Guardar',body:'<div class="g2"><div class="f"><label for="pe_n">Nombre</label><input id="pe_n" value="'+h(u.n)+'"></div><div class="f"><label for="pe_r">Rol</label><select id="pe_r">'+opts(Object.keys(ROL),u.rol,k=>[k,ROL[k]])+'</select></div><div class="f"><label for="pe_e">Especialidad / puesto</label><input id="pe_e" value="'+h(u.esp)+'"></div><div class="f"><label for="pe_c">% comisión sobre mano de obra</label><input id="pe_c" inputmode="decimal" value="'+u.com+'"></div></div>',
 onOk:()=>{const c=num(val('pe_c'));if(val('pe_n').trim().length<3){merr('Cargá el nombre.');return false}if(c<0||c>50){merr('La comisión debe estar entre 0 y 50 %.');return false}if(d.id&&u.rol==='dueno'&&val('pe_r')!=='dueno'&&DB.users.filter(x=>x.rol==='dueno').length<2){merr('Debe haber al menos un dueño.');return false}
  const x=d.id?u:{id:uid('u')};Object.assign(x,{n:val('pe_n').trim(),rol:val('pe_r'),esp:val('pe_e').trim(),com:c});if(!d.id)DB.users.push(x);audit('Personal '+(d.id?'editado':'nuevo'),x.n);save();renderView();return true}})};

/* ===== Reportes ===== */
function repRange(){const t=TODAY();return UI.repoPer==='hoy'?[t,t]:UI.repoPer==='sem'?[addDays(-6),t]:UI.repoPer==='mes'?[t.slice(0,8)+'01',t]:['0000-00-00','9999-99-99']}
V.reportes=()=>{const [a,b]=repRange();const os=DB.ots.filter(o=>o.estado==='Entregado'&&o.entregada>=a&&o.entregada<=b);let neto=0,iva=0,costo=0,rep=0,mo=0;const mec={},rub={};
 os.forEach(o=>{const t=otTotal(o);neto+=t.neto;iva+=t.iva;costo+=t.costo;rep+=t.rep;mo+=t.mo;const k=(userOf(o.mecId)||{n:'Sin asignar'}).n;mec[k]=(mec[k]||0)+t.mo;o.items.forEach(i=>{if(i.k==='rep'){const r=repOf(i.repId),k2=r?r.rubro:'Otros';const x=rub[k2]=rub[k2]||{v:0,c:0};x.v+=i.qty*i.pu;x.c+=i.qty*(i.costo||0)}})});
 const med={};DB.ots.forEach(o=>o.pagos.forEach(p=>{if(p.fecha>=a&&p.fecha<=b)med[p.medio]=(med[p.medio]||0)+p.monto}));const mx=Math.max(1,...Object.values(mec),...Object.values(rub).map(x=>x.v));
 const bars=(o,f)=>Object.keys(o).length?Object.keys(o).sort((x,y)=>f(o[y])-f(o[x])).map(k=>'<div style="margin:6px 0"><div class="row sm"><span class="sp">'+h(k)+'</span><b>'+fmt(f(o[k]))+'</b></div><div class="hbar" style="width:'+Math.max(1,f(o[k])/mx*100)+'%"></div></div>').join(''):'<p class="mut">Sin datos.</p>';
 return '<div class="bar"><h2>Reportes</h2><div class="chips">'+[['hoy','Hoy'],['sem','7 días'],['mes','Este mes'],['todo','Todo']].map(x=>'<button class="chip'+(UI.repoPer===x[0]?' on':'')+'" data-act="repoper" data-p="'+x[0]+'">'+x[1]+'</button>').join('')+'</div><span class="sp"></span><button class="btn s" data-act="repocsv">Exportar OT (Excel)</button></div>'+
 '<div class="g4" style="margin-bottom:12px"><div class="kpi" style="cursor:default"><div class="v">'+os.length+'</div><div class="l">OT entregadas</div></div><div class="kpi" style="cursor:default"><div class="v">'+fmt(neto+iva)+'</div><div class="l">Facturación total (c/IVA)</div></div><div class="kpi okk" style="cursor:default"><div class="v">'+fmt(neto-costo)+'</div><div class="l">Margen bruto (neto − costo repuestos)</div></div><div class="kpi" style="cursor:default"><div class="v">'+fmt(os.length?(neto+iva)/os.length:0)+'</div><div class="l">Ticket promedio</div></div></div>'+
 '<div class="g2"><div class="card"><h3>Mano de obra por mecánico (neto)</h3>'+bars(mec,x=>x)+'</div><div class="card"><h3>Venta de repuestos por rubro (neto)</h3>'+bars(rub,x=>x.v)+'</div></div>'+
 '<div class="g2"><div class="card"><h3>Composición</h3><p>Repuestos: <b>'+fmt(rep)+'</b> · Mano de obra: <b>'+fmt(mo)+'</b> · IVA: <b>'+fmt(iva)+'</b></p><p class="sm mut">Costo de repuestos vendidos: '+fmt(costo)+'</p></div><div class="card"><h3>Cobros del período por medio</h3>'+(Object.keys(med).length?Object.keys(med).map(k=>'<div class="row"><span class="sp">'+k+'</span><b>'+fmt(med[k])+'</b></div>').join(''):'<p class="mut">Sin cobros.</p>')+'</div></div>'+
 '<div class="card"><h3>Posición actual</h3><div class="g3"><div>Deuda de clientes<br><b>'+fmt(DB.clientes.reduce((s,c)=>s+c.saldo,0))+'</b></div><div>Deuda con proveedores<br><b>'+fmt(DB.provs.reduce((s,p)=>s+provDeuda(p.id),0))+'</b></div><div>Stock valorizado a costo<br><b>'+fmt(DB.repuestos.filter(r=>r.activo).reduce((s,r)=>s+r.qty*r.pc,0))+'</b></div></div></div>'};
ACT.repoper=d=>{UI.repoPer=d.p;renderView()};
ACT.repocsv=()=>{const [a,b]=repRange();csvDown('ordenes_'+TODAY()+'.csv',[['OT','Fecha ingreso','Entrega','Patente','Cliente','Mecánico','Neto','IVA','Total','Costo repuestos']].concat(DB.ots.filter(o=>o.estado==='Entregado'&&o.entregada>=a&&o.entregada<=b).map(o=>{const t=otTotal(o);return [otNum(o),o.fecha,o.entregada,(vehOf(o.vehId)||{}).pat,(cliOf(o.cliId)||{}).n,(userOf(o.mecId)||{}).n||'',t.neto,t.iva,t.total,t.costo]})))};

/* ===== Configuración ===== */
V.config=()=>{const c=DB.cfg;return '<div class="bar"><h2>Configuración</h2></div><div class="card"><h3>Datos del taller</h3><div class="g3"><div class="f"><label for="cf_n">Nombre</label><input id="cf_n" value="'+h(c.nombre)+'"></div><div class="f"><label for="cf_d">Dirección</label><input id="cf_d" value="'+h(c.dir)+'"></div><div class="f"><label for="cf_t">Teléfono / WhatsApp</label><input id="cf_t" value="'+h(c.tel)+'"></div><div class="f"><label for="cf_m">Correo</label><input id="cf_m" value="'+h(c.mail)+'"></div><div class="f"><label for="cf_f">Facebook</label><input id="cf_f" value="'+h(c.fb)+'"></div><div class="f"><label for="cf_i">Instagram</label><input id="cf_i" value="'+h(c.ig)+'"></div></div><button class="btn p" data-act="cfsave">Guardar datos</button></div>'+
 '<div class="card"><h3>Opciones (banderas)</h3><label style="font-weight:500;color:var(--tx)"><input type="checkbox" style="width:auto;min-height:0" '+(c.traspasoSinRubro?'checked':'')+' data-chg="cfflag" data-f="traspasoSinRubro"> Permitir traspasos entre cajas sin elegir rubro (usa el concepto interno oculto “Traspaso interno”). Apagada por defecto.</label><p class="sm mut">El rubro financiero sigue siendo obligatorio en ingresos y egresos de caja.</p><label style="font-weight:500;color:var(--tx);margin-top:8px"><input type="checkbox" style="width:auto;min-height:0" '+(c.recepCobra?'checked':'')+' data-chg="cfflag" data-f="recepCobra"> Permitir que Recepción cobre y entregue vehículos (por defecto lo hacen sólo el dueño y el jefe de taller).</label></div>'+
 '<div class="card"><h3>Catálogo de mano de obra</h3><div class="tw"><table class="itbl"><thead><tr><th>Servicio</th><th class="n">Precio neto</th></tr></thead><tbody>'+DB.servicios.map(s=>'<tr><td>'+h(s.n)+'</td><td><input style="max-width:140px;margin-left:auto;display:block;text-align:right" inputmode="decimal" data-chg="cfserv" data-id="'+s.id+'" value="'+s.pu+'" aria-label="Precio '+h(s.n)+'"></td></tr>').join('')+'</tbody></table></div></div>'+
 '<div class="card"><h3>Respaldo y demo</h3><div class="row"><button class="btn" data-act="cfexp">Exportar respaldo (JSON)</button><label class="btn" style="margin:0">Importar respaldo<input type="file" accept=".json,application/json" id="cf_imp" hidden data-chg="cfimp"></label><button class="btn d" data-act="cfreset">Restablecer datos de demo</button></div></div>'+
 '<div class="card"><h3>Auditoría (últimos movimientos)</h3><div class="tw" style="max-height:300px"><table><thead><tr><th>Cuándo</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr></thead><tbody>'+DB.audit.slice(0,60).map(a=>'<tr><td>'+ftime(a.t)+'</td><td>'+h(a.u)+'</td><td>'+h(a.a)+'</td><td>'+h(a.d)+'</td></tr>').join('')+'</tbody></table></div></div>'};
ACT.cfsave=()=>{const c=DB.cfg;if(val('cf_n').trim().length<3){toast('Cargá el nombre.',1);return}Object.assign(c,{nombre:val('cf_n').trim(),dir:val('cf_d').trim(),tel:val('cf_t').trim(),mail:val('cf_m').trim(),fb:val('cf_f').trim(),ig:val('cf_i').trim()});audit('Datos del taller editados');save();toast('Datos guardados')};
CHG.cfflag=t=>{DB.cfg[t.dataset.f]=t.checked;audit('Bandera',t.dataset.f+' = '+t.checked);save()};
CHG.cfserv=t=>{const s=DB.servicios.find(x=>x.id===t.dataset.id);const v=num(t.value);if(v>=0){s.pu=v;save()}};
ACT.cfexp=()=>{const b=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='respaldo_taller_'+TODAY()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)};
CHG.cfimp=t=>{const f=t.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||o.ver!==2||!Array.isArray(o.ots)||!Array.isArray(o.repuestos))throw 0;confirmBox('Se reemplazan todos los datos actuales por los del respaldo. ¿Continuar?',()=>{DB=o;save();ME=userOf(ME.id)||DB.users[0];renderShell();toast('Respaldo importado')},'Importar')}catch(e){toast('El archivo no es un respaldo válido.',1)}};rd.readAsText(f)};
ACT.cfreset=()=>confirmBox('Se borran los cambios y vuelven los datos de ejemplo. ¿Continuar?',()=>{resetDemo();ME=DB.users[0];renderShell();toast('Datos de demo restablecidos')},'Restablecer');

/* ===== Eventos globales ===== */
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a||a.disabled)return;const f=ACT[a.dataset.act];if(!f)return;f(a.dataset,a,e)});
document.addEventListener('input',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.chg&&CHG[t.dataset.chg])CHG[t.dataset.chg](t,e)});
document.addEventListener('change',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.chgc&&CHGC[t.dataset.chgc])CHGC[t.dataset.chgc](t,e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const l=$('#lb');if(l){l.remove();return}}if(e.key==='Escape'&&MODAL)closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.cell,.kc')){e.preventDefault();e.target.click()}});
ACT.mclose=()=>closeModal();
ACT.mok=()=>{if(!MODAL||!MODAL.onOk)return;merr('');try{const r=MODAL.onOk();if(r===true)closeModal()}catch(e){merr(e.message||'Error inesperado.')}};
(function init(){try{const id=sessionStorage.getItem(SS);if(id)ME=userOf(id)||null}catch(e){}if(ME)renderShell();else renderLogin()})();
</script>
</body>
